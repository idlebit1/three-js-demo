            kickDir.y = 0.5;
            kickDir.normalize();

            // Add physics if not already a physics object
            const existingPhysObj = physicsObjects.find(p => p.mesh === mesh);
            if (existingPhysObj) {
                existingPhysObj.velocity.add(kickDir.multiplyScalar(5));
                existingPhysObj.velocity.y = 3;
                existingPhysObj.grounded = false;
            } else {
                // Clone and replace with physics version
                const parent = mesh.parent;
                const worldPos = new THREE.Vector3();
                mesh.getWorldPosition(worldPos);

                const kickedMesh = mesh.clone();
                kickedMesh.position.copy(worldPos);
                parent.add(kickedMesh);
                parent.remove(mesh);

                const physObj = createPhysicsObject(kickedMesh, kickDir.multiplyScalar(5));
                physObj.velocity.y = 3;
                physicsObjects.push(physObj);
            }
        }

            playSound('voltageZap');
            // Create electric spark effect
            const parent = mesh.parent || scene;
            const worldPos = new THREE.Vector3();
            mesh.getWorldPosition(worldPos);

            // Spark particles
            for (let i = 0; i < 10; i++) {
                const sparkGeo = new THREE.SphereGeometry(0.03, 4, 4);
                const sparkMat = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,

                });
                const spark = new THREE.Mesh(sparkGeo, sparkMat);
                spark.position.copy(intersectPoint);
                parent.add(spark);

                physicsObjects.push(createPhysicsObject(spark,
                    new THREE.Vector3(
                        (Math.random() - 0.5) * 8,
                        Math.random() * 5,
                        (Math.random() - 0.5) * 8
                    )
                ));
            }

            // Speed up spinner (with max speed limit)
            if (mesh.userData.spinSpeedX !== undefined) {
                const MAX_SPIN_MULTIPLIER = 5; // Max 5x original speed

                // Store original speeds if not already stored
                if (mesh.userData.originalSpinSpeedX === undefined) {
                    mesh.userData.originalSpinSpeedX = mesh.userData.spinSpeedX;
                    mesh.userData.originalSpinSpeedY = mesh.userData.spinSpeedY;
                    mesh.userData.originalSpinSpeedZ = mesh.userData.spinSpeedZ;
                }

                const origX = mesh.userData.originalSpinSpeedX;
                const origY = mesh.userData.originalSpinSpeedY;
                const origZ = mesh.userData.originalSpinSpeedZ;

                // Check if at or above max speed
                const currentMultiplier = Math.abs(mesh.userData.spinSpeedX / origX);

                if (currentMultiplier >= MAX_SPIN_MULTIPLIER) {
                    // At max - start slowing down (halve the speed)
                    mesh.userData.spinSpeedX *= 0.5;
                    mesh.userData.spinSpeedY *= 0.5;
                    mesh.userData.spinSpeedZ *= 0.5;

                    // Don't go below original speed
                    if (Math.abs(mesh.userData.spinSpeedX) < Math.abs(origX)) {
                        mesh.userData.spinSpeedX = origX;
                        mesh.userData.spinSpeedY = origY;
                        mesh.userData.spinSpeedZ = origZ;
                    }
                } else {
                    // Speed up
                    mesh.userData.spinSpeedX *= 1.5;
                    mesh.userData.spinSpeedY *= 1.5;
                    mesh.userData.spinSpeedZ *= 1.5;
                }
            }
        }

                    Math.random() * Math.PI
                );
                abyssWorld.add(piece);

                piece.userData.isDebris = true;
                physicsObjects.push(createPhysicsObject(piece,
                    new THREE.Vector3(
                        (Math.random() - 0.5) * 3,
                        Math.random() * 2,
                        (Math.random() - 0.5) * 3
                    )
                ));
            }

            // Remove the original coral piece
            parent.remove(coralMesh);
            if (coralMesh.geometry) coralMesh.geometry.dispose();
            if (coralMesh.material) coralMesh.material.dispose();
        }

        // Abyss interaction: swoosh seaweed
        function swooshSeaweed(seaweedGroup) {
            playSound('seaweedSwoosh');

            // Apply a strong bend to all segments
            seaweedGroup.children.forEach((seg, idx) => {
                const originalRotZ = seg.rotation.z;
                // Bend dramatically to one side
                const bendDir = Math.random() > 0.5 ? 1 : -1;
                seg.rotation.z = bendDir * (0.5 + idx * 0.15);

                // Animate back to normal
                const startRot = seg.rotation.z;
                const animStart = performance.now();
                const animDuration = 800;

                function animateBack() {
                    const elapsed = performance.now() - animStart;
                    const progress = Math.min(elapsed / animDuration, 1);
                    // Ease out
                    const easeProgress = 1 - Math.pow(1 - progress, 3);
                    seg.rotation.z = startRot + (0 - startRot) * easeProgress;

                    if (progress < 1) {
                        requestAnimationFrame(animateBack);
                    }
                }
                requestAnimationFrame(animateBack);
            });

            // Create small bubble particles
            for (let i = 0; i < 5; i++) {
                const bubbleGeo = new THREE.SphereGeometry(0.02, 6, 6);
                const bubbleMat = new THREE.MeshBasicMaterial({
                    color: 0xaaddff,
                    transparent: true,
                    opacity: 0.5
                });
                const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
                bubble.position.copy(seaweedGroup.position);
                bubble.position.y += 0.3 + Math.random() * 0.5;
                bubble.position.x += (Math.random() - 0.5) * 0.2;
                bubble.position.z += (Math.random() - 0.5) * 0.2;
                abyssWorld.add(bubble);

                bubble.userData.isDebris = true;
                bubble.userData.noInteract = true;
                physicsObjects.push(createPhysicsObject(bubble,
                    new THREE.Vector3(
                        (Math.random() - 0.5) * 0.5,
                        1 + Math.random() * 2,
                        (Math.random() - 0.5) * 0.5
                    )
                ));
            }
        }

        // Handle interaction based on object type and world
        function handleInteraction(intersect) {
            const mesh = intersect.object;
            const point = intersect.point;

            // Skip debris (already broken/interacted objects)
            if (mesh.userData && mesh.userData.isDebris) return;

            // Find which world this object belongs to
            let objectWorld = null;
            let parent = mesh.parent;
            while (parent) {
                if (parent === bambooWorld) { objectWorld = 'bamboo'; break; }
                if (parent === lavaWorld) { objectWorld = 'lava'; break; }
                if (parent === driftWorld) { objectWorld = 'drift'; break; }
                if (parent === voltageWorld) { objectWorld = 'voltage'; break; }
                if (parent === hearthWorld) { objectWorld = 'hearth'; break; }
                if (parent === simmerWorld) { objectWorld = 'simmer'; break; }
                if (parent === gladeWorld) { objectWorld = 'glade'; break; }
                if (parent === abyssWorld) { objectWorld = 'abyss'; break; }
                if (parent === melancholyWorld) { objectWorld = 'melancholy'; break; }
                if (parent === euphoriaWorld) { objectWorld = 'euphoria'; break; }
                if (parent === tensionWorld) { objectWorld = 'tension'; break; }
                if (parent === serenityWorld) { objectWorld = 'serenity'; break; }
                if (parent === grandWorld) { objectWorld = 'grand'; break; }
                parent = parent.parent;
            }

            if (!objectWorld) return;

            // Get original color (before texture) if available, otherwise current color
            const originalMat = originalMaterials.get(mesh);
            const color = originalMat && originalMat.color ? originalMat.color.getHex() :
                         (mesh.material && mesh.material.color ? mesh.material.color.getHex() : 0);
            const geoType = mesh.geometry ? mesh.geometry.type : '';

            switch (objectWorld) {
                case 'bamboo':
                    // Bamboo stalk = LatheGeometry
                    if (geoType === 'LatheGeometry') {
                        chopBambooLathe(mesh, point);
                    }
                    // Leaves = small PlaneGeometry not on ground
                    else if (geoType === 'PlaneGeometry' && Math.abs(mesh.rotation.x) < 0.5) {
                        kickObject(mesh, point, camera.position);
                    }
                    break;

                case 'lava':
                    // Break lava rocks (IcosahedronGeometry or DodecahedronGeometry)
                    if (geoType === 'IcosahedronGeometry' || geoType === 'DodecahedronGeometry' ||
                        geoType === 'BufferGeometry') {
                        // Skip the ground plane
                        if (mesh.rotation.x !== -Math.PI / 2) {
                            breakRock(mesh, point);
                        }
                    }
                    break;

                case 'drift':
                    // Floating stones explode and reconstitute based on userData
                    if (mesh.userData && mesh.userData.floatSpeed !== undefined) {
                        // If it's a hitbox, use the linked stone
                        const targetStone = mesh.userData.linkedStone || mesh;
                        // Skip if this stone is already exploding
                        if (!targetStone.userData.isHitbox && !targetStone.userData.isExploding) {
                            explodeAndReconstitute(targetStone, point);
                        }
                    }
                    // Papers flutter away
                    else if (geoType === 'PlaneGeometry' && mesh.rotation.x !== -Math.PI / 2) {
                        kickObject(mesh, point, camera.position);
                    }
                    break;

                case 'voltage':
                    // Zap spinners - anything with spin userData
                    if (mesh.userData && mesh.userData.spinSpeedX !== undefined) {
                        zapObject(mesh, point);
                    }
                    break;

                case 'hearth':
                    // Squish cushions and soft things (spheres not on ground)
                    if (geoType === 'SphereGeometry' && mesh.position.y > 0) {
                        squishObject(mesh, point);
                    }
                    break;

                case 'simmer':
                    // Kick toys around - objects with restlessness or velocity userData
                    if (mesh.userData && (mesh.userData.restlessness !== undefined ||
                        mesh.userData.velocity !== undefined)) {
                        kickObject(mesh, point, camera.position);
                    }
                    // Also kick containers
                    else if (geoType === 'CylinderGeometry') {
                        kickObject(mesh, point, camera.position);
                    }
                    break;

                case 'glade':
                    // Trees: CylinderGeometry (trunk) or IcosahedronGeometry (canopy)
                    if (geoType === 'CylinderGeometry' ||
                        (geoType === 'IcosahedronGeometry' && mesh.position.y > 1)) {
                        shakeTree(mesh, point);
                    }
                    // Mushroom: parent is a group with SphereGeometry cap
                    else if (mesh.parent && mesh.parent.isGroup &&
                             mesh.parent.children.some(c => c.geometry &&
                             c.geometry.type === 'SphereGeometry' && c.geometry.parameters &&
                             c.geometry.parameters.phiLength === Math.PI)) {
                        popMushroom(mesh.parent, point);
                    }
                    // Flowers: groups with multiple small parts
                    else if (mesh.parent && mesh.parent.isGroup &&
                             mesh.parent.children.length > 3 &&
                             mesh.parent.userData && mesh.parent.userData.swayPhase !== undefined) {
                        pickFlower(mesh.parent, point);
                    }
                    // Grass blades
                    else if (geoType === 'PlaneGeometry' && mesh.userData && mesh.userData.swayPhase !== undefined) {
                        kickObject(mesh, point, camera.position);
                    }
                    break;

                case 'abyss':
                    // Jellyfish - touch to make them glow brighter
                    if (mesh.parent && mesh.parent.userData && mesh.parent.userData.tentacles) {
                        glowJellyfish(mesh.parent);
                    }
                    // Coral formations - break them
                    else if (geoType === 'CylinderGeometry' && mesh.position.y > 0 && mesh.position.y < 1) {
                        breakCoral(mesh, point);
                    }
                    // Seaweed - swoosh it
                    else if (mesh.parent && mesh.parent.userData && mesh.parent.userData.swayPhase !== undefined) {
                        swooshSeaweed(mesh.parent);
                    }
                    break;

                case 'melancholy':
                    // Puddles ripple, wilted flowers sway
                    if (geoType === 'CircleGeometry' && mesh.userData && mesh.userData.ripplePhase !== undefined) {
                        playSound('bubblePop');
                        mesh.scale.setScalar(1.2);
                        setTimeout(() => mesh.scale.setScalar(1), 200);
                    }
                    break;

                case 'euphoria':
                    // Pop balloons
                    if (mesh.parent && mesh.parent.userData && mesh.parent.userData.bobSpeed !== undefined) {
                        playSound('mushroomPop');
                        const balloon = mesh.parent;
                        balloon.visible = false;
                        setTimeout(() => {
                            balloon.visible = true;
                            balloon.position.y = balloon.userData.baseY;
                        }, 2000);
                    }
                    break;

                case 'tension':
                    // Kick spikes
                    if (geoType === 'ConeGeometry') {
                        playSound('rockBreak');
                        kickObject(mesh, point, camera.position);
                    }
                    break;

                case 'serenity':
                    // Lotus flowers glow
                    if (mesh.parent && mesh.parent.userData && mesh.parent.userData.floatPhase !== undefined) {
                        playSound('flowerPick');
                    }
                    break;

                case 'grand':
                    // Trees: CylinderGeometry (trunk) or ConeGeometry (canopy)
                    if (geoType === 'CylinderGeometry' || geoType === 'ConeGeometry') {
                        shakeTree(mesh, point);
                    }
                    // Mountains: large ConeGeometry on ground
                    else if (geoType === 'ConeGeometry' && mesh.position.y > 5) {
                        breakRock(mesh, point);
                    }
                    break;
            }
        }

        // Interaction cooldown to prevent spam
        let lastInteractionTime = 0;
        const INTERACTION_COOLDOWN = 100; // ms between interactions

        // Unified interaction handler: raycasts both world objects and character,
        // processes hits front-to-back. Items in front of sphere win, sphere blocks
        // items behind it.
        function onInteract(event) {
            if (!interactiveMode) return;

            // Cooldown check
            const now = performance.now();
            if (now - lastInteractionTime < INTERACTION_COOLDOWN) return;

            // Get normalized device coordinates
            const rect = renderer.domElement.getBoundingClientRect();
            let clientX, clientY;

            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                if (event.button !== undefined && event.button !== 0) return;
                clientX = event.clientX;
                clientY = event.clientY;
            }

            interactiveMouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            interactiveMouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            // Raycast against everything: world objects + character
            interactiveRaycaster.setFromCamera(interactiveMouse, camera);

            const worldToCheck = currentScale === 'grand' ? grandWorld :
                (currentWorld === 'bamboo' ? bambooWorld :
                 currentWorld === 'lava' ? lavaWorld :
                 currentWorld === 'drift' ? driftWorld :
                 currentWorld === 'voltage' ? voltageWorld :
                 currentWorld === 'hearth' ? hearthWorld :
                 currentWorld === 'simmer' ? simmerWorld :
                 currentWorld === 'glade' ? gladeWorld :
                 currentWorld === 'abyss' ? abyssWorld :
                 currentWorld === 'melancholy' ? melancholyWorld :
                 currentWorld === 'euphoria' ? euphoriaWorld :
                 currentWorld === 'tension' ? tensionWorld :
                 currentWorld === 'serenity' ? serenityWorld : null);

            // Collect all objects to raycast: world + character
            const targets = [];
            if (worldToCheck) targets.push(...worldToCheck.children);
            targets.push(...clickableMeshes);

            const intersects = interactiveRaycaster.intersectObjects(targets, true);

            for (const intersect of intersects) {
                const obj = intersect.object;

                // Skip non-interactive particles, dust, etc.
                if (obj.userData && obj.userData.noInteract) continue;
                // Skip ground planes
                if (obj.geometry && obj.geometry.type === 'PlaneGeometry' &&
                    obj.rotation.x === -Math.PI / 2) continue;
                if (obj.geometry && obj.geometry.type === 'CircleGeometry' &&
                    obj.rotation.x === -Math.PI / 2) continue;

                // Check if this is the character (sphere/panda body)
                if (clickableMeshes.includes(obj)) {
                    // Character hit - handle sphere/panda interaction
                    lastInteractionTime = now;
                    if (event.touches) event.preventDefault();
                    handleCharacterTap(intersect);
                    return;
                }

                // World object in front of character - handle world interaction
                lastInteractionTime = now;
                if (event.touches) event.preventDefault();
                handleInteraction(intersect);
                return;
            }
        }

        // Add event listeners for interaction (tap onset: mousedown + touchstart)
        renderer.domElement.addEventListener('mousedown', onInteract);
        renderer.domElement.addEventListener('touchstart', onInteract, { passive: false });

        // ============================================
        // CRYPTIC SCRIPTS - Mystical floating text
        // ============================================
        let crypticEnabled = false;
        const crypticGroup = new THREE.Group();
        crypticGroup.visible = false;
        scene.add(crypticGroup);

        // Cryptic symbols and scripts
        const crypticChars = [
            'ᚠ', 'ᚢ', 'ᚦ', 'ᚨ', 'ᚱ', 'ᚲ', 'ᚷ', 'ᚹ', 'ᚺ', 'ᚾ', 'ᛁ', 'ᛃ', 'ᛇ', 'ᛈ', 'ᛉ', 'ᛊ', // Runes
            'ψ', 'Ω', 'φ', 'λ', 'Σ', 'Δ', 'Θ', 'Ξ', 'Π', // Greek
            '☯', '⚡', '∞', '◊', '△', '○', '□', '☽', '☀', '★', '⬡', // Symbols
            'ア', 'カ', 'サ', 'タ', 'ナ', 'ハ', 'マ', 'ヤ', 'ラ', 'ワ', // Katakana
            '𐤀', '𐤁', '𐤂', '𐤃', '𐤄', '𐤅', '𐤆', '𐤇', '𐤈', '𐤉', // Phoenician
            '𓀀', '𓁿', '𓂀', '𓃭', '𓆣', '𓇳', '𓊽', '𓏲', // Egyptian-style
        ];

        // Generate a glyph texture
        function generateGlyphTexture(char, color = '#aaccff') {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = color;
            ctx.font = 'bold 48px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 32, 32);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // Pre-generate some glyph textures
        const glyphTextures = [];
        const glyphColors = ['#aaccff', '#ffaacc', '#aaffcc', '#ffffaa', '#ccaaff', '#ffffff'];
        for (let i = 0; i < 30; i++) {
            const char = crypticChars[Math.floor(Math.random() * crypticChars.length)];
            const color = glyphColors[Math.floor(Math.random() * glyphColors.length)];
            glyphTextures.push(generateGlyphTexture(char, color));
        }

        // Floating ribbon streams of glyphs
        const glyphRibbons = [];
        const RIBBON_COUNT = 8;
        const GLYPHS_PER_RIBBON = 12;

        for (let r = 0; r < RIBBON_COUNT; r++) {
            const ribbon = {
                glyphs: [],
                baseAngle: (r / RIBBON_COUNT) * Math.PI * 2,
                radius: 4 + Math.random() * 4,
                height: Math.random() * 3,
                speed: 0.2 + Math.random() * 0.3,
                verticalSpeed: 0.1 + Math.random() * 0.2,
                waveAmplitude: 0.5 + Math.random() * 1,
                waveFrequency: 1 + Math.random() * 2,
            };

            for (let g = 0; g < GLYPHS_PER_RIBBON; g++) {
                const texture = glyphTextures[Math.floor(Math.random() * glyphTextures.length)];
                const spriteMat = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.6 + Math.random() * 0.3,
                    blending: THREE.AdditiveBlending,
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(0.3 + Math.random() * 0.2, 0.3 + Math.random() * 0.2, 1);
                sprite.userData = {
                    ribbonOffset: g / GLYPHS_PER_RIBBON,
                    phaseOffset: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 2,
                };
                ribbon.glyphs.push(sprite);
                crypticGroup.add(sprite);
            }

            glyphRibbons.push(ribbon);
        }

        // Orbiting glyphs around the character
        const orbitingGlyphs = [];
        const ORBIT_COUNT = 6;

        for (let i = 0; i < ORBIT_COUNT; i++) {
            const texture = glyphTextures[Math.floor(Math.random() * glyphTextures.length)];
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.25, 0.25, 1);
            sprite.userData = {
                orbitRadius: 1.2 + Math.random() * 0.5,
                orbitSpeed: 0.5 + Math.random() * 0.5,
                orbitPhase: (i / ORBIT_COUNT) * Math.PI * 2,
                orbitTilt: (Math.random() - 0.5) * 0.5,
                bobSpeed: 1 + Math.random(),
                bobAmount: 0.1 + Math.random() * 0.1,
            };
            orbitingGlyphs.push(sprite);
            crypticGroup.add(sprite);
        }

        // Floating overlay glyphs on world objects
        const overlayGlyphs = [];

        function createOverlayGlyph(position, scale = 0.4) {
            const texture = glyphTextures[Math.floor(Math.random() * glyphTextures.length)];
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.copy(position);
            sprite.scale.set(scale, scale, 1);
            sprite.userData = {
                basePos: position.clone(),
                floatSpeed: 0.5 + Math.random() * 0.5,
                floatPhase: Math.random() * Math.PI * 2,
                floatAmount: 0.1 + Math.random() * 0.1,
                pulseSpeed: 1 + Math.random() * 2,
            };
            overlayGlyphs.push(sprite);
            crypticGroup.add(sprite);
            return sprite;
        }

        // Scatter some overlay glyphs in the scene
        for (let i = 0; i < 20; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 2 + Math.random() * 5;
            const pos = new THREE.Vector3(
                Math.cos(angle) * radius,
                0.5 + Math.random() * 3,
                Math.sin(angle) * radius
            );
            createOverlayGlyph(pos, 0.3 + Math.random() * 0.3);
        }

        // Update cryptic elements
        function updateCrypticScripts(time) {
            if (!crypticEnabled) return;

            // Update ribbon streams
            glyphRibbons.forEach(ribbon => {
                ribbon.glyphs.forEach(glyph => {
                    const u = glyph.userData;
                    const t = time * ribbon.speed + u.ribbonOffset * Math.PI * 2;

                    // Spiral motion with wave
                    const angle = ribbon.baseAngle + t;
                    const wave = Math.sin(t * ribbon.waveFrequency + u.phaseOffset) * ribbon.waveAmplitude;

                    glyph.position.x = Math.cos(angle) * (ribbon.radius + wave * 0.5);
                    glyph.position.z = Math.sin(angle) * (ribbon.radius + wave * 0.5);
                    glyph.position.y = ribbon.height + Math.sin(time * ribbon.verticalSpeed + u.ribbonOffset * Math.PI * 4) * 1.5 + wave;

                    // Fade based on position
                    glyph.material.opacity = 0.3 + Math.sin(t * 2 + u.phaseOffset) * 0.3;

                    // Rotate (sprites face camera but we can adjust scale for effect)
                    const pulse = 1 + Math.sin(time * 3 + u.phaseOffset) * 0.1;
                    glyph.scale.set(0.3 * pulse, 0.3 * pulse, 1);
                });
            });

            // Update orbiting glyphs around character
            const charPos = currentCharacter.body ? currentCharacter.body.position : new THREE.Vector3(0, 2, 0);
            orbitingGlyphs.forEach(glyph => {
                const u = glyph.userData;
                const angle = time * u.orbitSpeed + u.orbitPhase;

                glyph.position.x = charPos.x + Math.cos(angle) * u.orbitRadius;
                glyph.position.z = charPos.z + Math.sin(angle) * u.orbitRadius;
                glyph.position.y = charPos.y + 0.5 + Math.sin(angle * 0.5) * u.orbitTilt + Math.sin(time * u.bobSpeed) * u.bobAmount;

                // Pulse opacity
                glyph.material.opacity = 0.5 + Math.sin(time * 2 + u.orbitPhase) * 0.3;
            });

            // Update overlay glyphs
            overlayGlyphs.forEach(glyph => {
                const u = glyph.userData;
                glyph.position.y = u.basePos.y + Math.sin(time * u.floatSpeed + u.floatPhase) * u.floatAmount;

                // Pulse effect
                const pulse = 0.4 + Math.sin(time * u.pulseSpeed + u.floatPhase) * 0.2;
                glyph.material.opacity = pulse;
            });
        }

        // Toggle cryptic scripts
        function toggleCrypticScripts(enabled) {
            crypticEnabled = enabled;
            crypticGroup.visible = enabled;
        }

        // ============================================
        // SOUND SYSTEM - Tone.js interaction sounds
        // ============================================
        let audioStarted = false;

        // Master output chain: limiter prevents clipping
        const masterLimiter = new Tone.Limiter(-6).toDestination();
        const masterVol = new Tone.Volume(-10).connect(masterLimiter);

        // Start audio context on first user interaction
        async function ensureAudioStarted() {
            if (!audioStarted && Tone.context.state !== 'running') {
                await Tone.start();
                audioStarted = true;
            }
        }

        // Create synthesizers for different sound types
        const sounds = {
            // Bamboo chop - woody percussive hit
            bambooChop: () => {
                const synth = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
                }).connect(masterVol);
                synth.triggerAttackRelease('G2', '16n');
                setTimeout(() => synth.dispose(), 500);
            },

            // Rock break - crunchy noise burst
            rockBreak: () => {
                const noise = new Tone.NoiseSynth({
                    noise: { type: 'brown' },
                    envelope: { attack: 0.005, decay: 0.15, sustain: 0, release: 0.1 }
                }).connect(masterVol);
                noise.triggerAttackRelease('8n');
                setTimeout(() => noise.dispose(), 500);
            },

            // Flower pick - gentle pluck
            flowerPick: () => {
                const synth = new Tone.PluckSynth({
                    attackNoise: 1,
                    dampening: 4000,
                    resonance: 0.98
                }).connect(masterVol);
                const notes = ['C5', 'E5', 'G5', 'A5'];
                synth.triggerAttack(notes[Math.floor(Math.random() * notes.length)]);
                setTimeout(() => synth.dispose(), 1000);
            },

            // Mushroom pop - bouncy pop
            mushroomPop: () => {
                const synth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
                }).connect(masterVol);
                synth.triggerAttackRelease('C4', '32n');
                setTimeout(() => {
                    synth.triggerAttackRelease('E4', '32n');
                }, 50);
                setTimeout(() => synth.dispose(), 500);
            },

            // Tree shake - rustling
            treeShake: () => {
                const filter = new Tone.Filter(2000, 'lowpass').connect(masterVol);
                const noise = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.05, decay: 0.3, sustain: 0.1, release: 0.4 }
                }).connect(filter);
                noise.triggerAttackRelease('4n');
                setTimeout(() => { noise.dispose(); filter.dispose(); }, 1000);
            },

            // Voltage zap - electric spark
            voltageZap: () => {
                const synth = new Tone.Synth({
                    oscillator: { type: 'sawtooth' },
                    envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.05 }
                }).connect(masterVol);
                synth.triggerAttackRelease('A5', '32n');
                setTimeout(() => synth.triggerAttackRelease('E6', '32n'), 30);
                setTimeout(() => synth.triggerAttackRelease('C6', '32n'), 60);
                setTimeout(() => synth.dispose(), 500);
            },

            // Cushion squish - soft thud
            cushionSquish: () => {
                const synth = new Tone.MembraneSynth({
                    pitchDecay: 0.1,
                    octaves: 2,
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
                }).connect(masterVol);
                synth.triggerAttackRelease('E1', '8n');
                setTimeout(() => synth.dispose(), 500);
            },

            // Toy kick - bouncy hit
            toyKick: () => {
                const synth = new Tone.Synth({
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
                }).connect(masterVol);

        // Create tapered grass blade geometry
        function createGrassBladeGeometry() {
            const geo = new THREE.BufferGeometry();
            const verts = new Float32Array([
                -0.02, 0, 0,      // base left
                0.02, 0, 0,       // base right
                0.015, 0.15, 0,   // mid right
                -0.015, 0.15, 0,  // mid left
                0.008, 0.3, 0,    // upper right
                -0.008, 0.3, 0,   // upper left
                0, 0.4, 0         // tip
            ]);
            const indices = [0,1,2, 0,2,3, 3,2,4, 3,4,5, 5,4,6];
            geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            geo.setIndex(indices);
            geo.computeVertexNormals();
            return geo;
        }

        // Animate high/super/texture detail elements
        function animateHighDetail(time) {
            if (detailLevel === 'normal') return;

            // Update shader time uniforms
            shellGrassUniforms.time.value = time;
            textureUniforms.time.value = time;

            // Animate high detail
            if (detailLevel === 'high') {
                const group = highDetailGroups[currentWorld];
                if (!group) return;

                group.children.forEach(child => {
                    if (child.userData.geo) {
                        const positions = child.userData.geo.attributes.position.array;
                        const base = child.userData.basePositions;
                        if (base) {
                            for (let i = 0; i < positions.length / 3; i++) {
                                const phase = i * 0.5;
                                positions[i * 3] = base[i * 3] + Math.sin(time * 0.3 + phase) * 0.3;
                                positions[i * 3 + 1] = base[i * 3 + 1] + Math.sin(time * 0.5 + phase) * 0.2;
                                positions[i * 3 + 2] = base[i * 3 + 2] + Math.cos(time * 0.4 + phase) * 0.3;
                            }
                            child.userData.geo.attributes.position.needsUpdate = true;
                        }
                    }
                    if (child.userData.baseY !== undefined) {
                        child.position.y = child.userData.baseY + Math.sin(time * 0.5 + child.userData.phase) * 0.3;
                        child.rotation.z = Math.sin(time * 0.3 + child.userData.phase) * 0.2;
                    }
                });
            }

            // Animate super detail particles
            if (detailLevel === 'super') {
                const group = superDetailGroups[currentWorld];
                if (!group) return;

                group.children.forEach(child => {
                    if (child.userData.geo && child.userData.basePositions) {
                        const positions = child.userData.geo.attributes.position.array;
                        const base = child.userData.basePositions;
                        const count = positions.length / 3;

                        for (let i = 0; i < count; i++) {
                            const phase = i * 0.3;

                            if (child.userData.isEmber) {
                                // Embers rise and flicker
                                positions[i * 3] = base[i * 3] + Math.sin(time + phase) * 0.5;
                                positions[i * 3 + 1] = (base[i * 3 + 1] + time * 0.3 + phase * 0.1) % 8;
                                positions[i * 3 + 2] = base[i * 3 + 2] + Math.cos(time * 0.8 + phase) * 0.5;
                            } else if (child.userData.isSpark) {
                                // Sparks jitter erratically
                                positions[i * 3] = base[i * 3] + Math.sin(time * 5 + phase * 10) * 0.2;
                                positions[i * 3 + 1] = base[i * 3 + 1] + Math.sin(time * 4 + phase * 8) * 0.15;
                                positions[i * 3 + 2] = base[i * 3 + 2] + Math.cos(time * 6 + phase * 12) * 0.2;
                            } else if (child.userData.rising) {
                                // Steam rises
                                positions[i * 3] = base[i * 3] + Math.sin(time * 0.5 + phase) * 0.4;
                                positions[i * 3 + 1] = (base[i * 3 + 1] + time * 0.2 + phase * 0.05) % 6;
                                positions[i * 3 + 2] = base[i * 3 + 2] + Math.cos(time * 0.4 + phase) * 0.4;
                            } else {
                                // Gentle float
                                positions[i * 3] = base[i * 3] + Math.sin(time * 0.2 + phase) * 0.4;
                                positions[i * 3 + 1] = base[i * 3 + 1] + Math.sin(time * 0.3 + phase) * 0.2;
                                positions[i * 3 + 2] = base[i * 3 + 2] + Math.cos(time * 0.25 + phase) * 0.4;
                            }
                        }
                        child.userData.geo.attributes.position.needsUpdate = true;
                    }
                });
            }
        }

        // Update detail visibility when world or level changes
        function updateDetailVisibility() {
            Object.keys(highDetailGroups).forEach(key => {
                highDetailGroups[key].visible = (detailLevel === 'high') && (key === currentWorld);
            });
            Object.keys(superDetailGroups).forEach(key => {
                superDetailGroups[key].visible = (detailLevel === 'super') && (key === currentWorld);
            });

            // Handle texture mode - apply/remove textures to existing geometry
            if (detailLevel === 'texture' && !textureModeActive) {
                applyTexturesToScene();
                textureModeActive = true;
            } else if (detailLevel !== 'texture' && textureModeActive) {
                removeTexturesFromScene();
                textureModeActive = false;
            }
        }

        // Animate grand world
        function animateGrandWorld(time, deltaTime) {
            if (currentScale !== 'grand') return;

            // Clouds drifting
            [...lowClouds, ...highClouds].forEach(cloud => {
                const c = cloud.userData;
                cloud.position.x = c.baseX + Math.sin(time * c.driftSpeed * 0.1 + c.driftPhase) * 10;
                cloud.position.z = c.baseZ + Math.cos(time * c.driftSpeed * 0.1 + c.driftPhase) * 5;
            });

            // Grand birds circling
            grandBirds.forEach(bird => {
                const b = bird.userData;
                const angle = time * b.circleSpeed + b.phase;
                bird.position.x = Math.cos(angle) * b.circleRadius;
                bird.position.z = Math.sin(angle) * b.circleRadius;
                bird.position.y = b.baseY + Math.sin(time + b.phase) * 2;
                bird.rotation.y = -angle + Math.PI / 2;

                // Wing flapping
                b.leftWing.rotation.x = Math.sin(time * 4) * 0.4;
            });

            // Floating islands bobbing
            floatingIslands.forEach(island => {
                const i = island.userData;
                island.position.y = i.baseY + Math.sin(time * i.bobSpeed + i.bobPhase) * 1;
                island.rotation.y += i.rotateSpeed * deltaTime;
            });

            // Aurora waving
            auroraLights.forEach(aurora => {
                const a = aurora.userData;
                const positions = aurora.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    const x = aurora.geometry.attributes.position.getX(i / 3);
                    positions[i + 2] = Math.sin(time * a.waveSpeed + x * 0.2 + a.wavePhase) * 3;
                }
                aurora.geometry.attributes.position.needsUpdate = true;
                aurora.material.opacity = 0.2 + Math.sin(time * 0.5 + a.wavePhase) * 0.1;
            });

            // Stars twinkling
            stars.forEach(star => {
                const s = star.userData;
                star.material.opacity = 0.5 + Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.5;
            });

            // Animate world-specific grand content
            const worldGroup = grandContentGroups[currentWorld];
            if (worldGroup && worldGroup.visible) {
                worldGroup.children.forEach(child => {
                    const u = child.userData;
                    // Floating lanterns (bamboo)
                    if (u.floatSpeed) {
                        child.position.y = u.baseY + Math.sin(time * u.floatSpeed) * 2;
                    }
                    // Phoenixes (lava)
                    if (u.angle !== undefined && u.radius && u.speed) {
                        u.angle += u.speed * deltaTime;
                        child.position.x = Math.cos(u.angle) * u.radius;
                        child.position.z = Math.sin(u.angle) * u.radius;
                        child.rotation.y = -u.angle;
                    }
                    // Rotating shards
                    if (u.rotSpeed) {
                        child.rotation.y += u.rotSpeed * deltaTime;
                        child.rotation.x += u.rotSpeed * deltaTime * 0.5;
                    }
                    // Drifting papers (drift)
                    if (u.driftSpeed) {
                        child.rotation.z += u.driftSpeed * deltaTime;
                        child.position.y += Math.sin(time * 0.5) * 0.01;
                    }
                    // Orbiting satellites (voltage)
                    if (u.orbitSpeed) {
                        child.rotation.y += u.orbitSpeed * deltaTime;
                    }
                    // Tumbling toys (simmer)
                    if (u.tumbleSpeed) {
                        child.rotation.x += u.tumbleSpeed * deltaTime;
                        child.rotation.z += u.tumbleSpeed * deltaTime * 0.7;
                    }
                    // Flocking birds (glade)
                    if (u.flockAngle !== undefined && u.flockRadius && u.flockSpeed) {
                        u.flockAngle += u.flockSpeed * deltaTime;
                        child.position.x += Math.cos(u.flockAngle) * 0.1;
                        child.position.z += Math.sin(u.flockAngle) * 0.1;
                        child.rotation.y = -u.flockAngle;
                    }
                    // Giant butterflies (glade)
                    if (u.flapPhase !== undefined) {
                        child.rotation.x = Math.sin(time * 3 + u.flapPhase) * 0.3;
                    }
                });
            }

            // Camera follow logic - improved tracking
            if (cameraFollowEnabled && floatModeEnabled) {
                const charY = currentCharacter.group.position.y;

                // Zoom out gently as we go higher
                targetCameraDistance = 8 + Math.min(charY * 0.12, 25);

                // Smoothly move camera target to character level (faster tracking)
                controls.target.y += (charY + 1.5 - controls.target.y) * 0.15;

                // Keep camera at same relative height - stay level with character
                const desiredCameraY = controls.target.y + 2;
                camera.position.y += (desiredCameraY - camera.position.y) * 0.12;

                // Adjust horizontal distance smoothly
                const horizontalDist = Math.sqrt(
                    Math.pow(camera.position.x, 2) + Math.pow(camera.position.z, 2)
                );
                if (Math.abs(horizontalDist - targetCameraDistance) > 0.3) {
                    const scale = 1 + (targetCameraDistance - horizontalDist) * 0.03;
                    camera.position.x *= scale;
                    camera.position.z *= scale;
                }

                // Adjust max distance for orbit controls
                controls.maxDistance = targetCameraDistance + 20;
                controls.minDistance = 2;

                // Change background color based on altitude and world
                scene.background.copy(getWorldSkyColor(currentWorld, charY));
            }
        }

        // Get world-specific sky color based on altitude
        function getWorldSkyColor(worldName, altitude) {
            const color = new THREE.Color();

            if (worldName === 'bamboo' || worldName === 'glade') {
                // Nature worlds - blue to purple to starry
                if (altitude < 30) {
                    color.setHSL(0.55, 0.6, 0.7 - altitude * 0.004);
                } else if (altitude < 100) {
                    color.setHSL(0.58, 0.5, 0.58 - (altitude - 30) * 0.003);
                } else {
                    color.setHSL(0.68, 0.4, Math.max(0.06, 0.37 - (altitude - 100) * 0.002));
                }
            } else if (worldName === 'lava') {
                // Lava - smoky red to black void
                if (altitude < 40) {
                    color.setHSL(0.02, 0.6, 0.12 + altitude * 0.002);
                } else if (altitude < 100) {
                    color.setHSL(0.0, 0.5, 0.2 - (altitude - 40) * 0.001);
                } else {
                    color.setHSL(0.0, 0.3, Math.max(0.02, 0.14 - (altitude - 100) * 0.001));
                }
            } else if (worldName === 'drift') {
                // Amber drift - warm amber to deep purple twilight
                if (altitude < 50) {
                    color.setHSL(0.08, 0.4, 0.22 + altitude * 0.002);
                } else if (altitude < 120) {
                    color.setHSL(0.08 + (altitude - 50) * 0.004, 0.35, 0.32 - (altitude - 50) * 0.001);
                } else {
                    color.setHSL(0.75, 0.25, Math.max(0.08, 0.18 - (altitude - 120) * 0.001));
                }
            } else if (worldName === 'voltage') {
                // Voltage - dark to electric storm to void
                if (altitude < 50) {
                    color.setHSL(0.6, 0.4, 0.06 + altitude * 0.002);
                } else if (altitude < 120) {
                    color.setHSL(0.55, 0.5, 0.16 + Math.sin(altitude * 0.1) * 0.05);
                } else {
                    color.setHSL(0.58, 0.3, Math.max(0.02, 0.1 - (altitude - 120) * 0.001));
                }
            } else if (worldName === 'hearth') {
                // Hearth - warm to dreamy to peaceful dark
                if (altitude < 40) {
                    color.setHSL(0.06, 0.45, 0.12 + altitude * 0.003);
                } else if (altitude < 100) {
                    color.setHSL(0.08 + (altitude - 40) * 0.005, 0.35, 0.24);
                } else {
                    color.setHSL(0.72, 0.25, Math.max(0.08, 0.2 - (altitude - 100) * 0.001));
                }
            } else if (worldName === 'simmer') {
                // Simmer - angry red to pressure release to calm dark
                if (altitude < 60) {
                    color.setHSL(0.0, 0.65, 0.1 + altitude * 0.002);
                } else if (altitude < 120) {
                    color.setHSL(0.0 + (altitude - 60) * 0.002, 0.5, 0.22 - (altitude - 60) * 0.001);
                } else {
                    color.setHSL(0.1, 0.3, Math.max(0.04, 0.16 - (altitude - 120) * 0.001));
                }
            } else {
                // Default fallback
                color.setHSL(0.55, 0.5, Math.max(0.05, 0.7 - altitude * 0.004));
            }

            return color;
        }

                for (let i = 0; i < 20; i++) {

                    );

                for (let i = 0; i < 10; i++) {

        // Create grand content for all worlds upfront
        Object.keys(grandContentGroups).forEach(createGrandContentForWorld);

        // Switch scale function
        function switchScale(scaleName) {
            currentScale = scaleName;

            if (scaleName === 'grand') {
                // Hide all standard world content
                bambooWorld.visible = false;
                lavaWorld.visible = false;
                driftWorld.visible = false;

                // Only show generic grand world (trees, mountains) for nature worlds
                const natureWorlds = ['bamboo', 'glade'];
                grandWorld.visible = natureWorlds.includes(currentWorld);

                // Show world-specific grand content
                Object.keys(grandContentGroups).forEach(key => {
                    grandContentGroups[key].visible = (key === currentWorld);
                });
                cameraFollowEnabled = true;
                controls.maxDistance = 100;
            } else {
                grandWorld.visible = false;
                // Hide all world-specific grand content
                Object.keys(grandContentGroups).forEach(key => {
                    grandContentGroups[key].visible = false;

                cameraFollowEnabled = false;
                controls.maxDistance = 30;
                controls.target.set(0, 1.8, 0);

                // Reset character position
                currentCharacter.group.position.y = 0;
                characterVelocityY = 0;

                // Reset background
                switchWorld(currentWorld);

        }

        // World backgrounds

        // Animate lava world elements
        function animateLavaWorld(time) {
            if (currentWorld !== 'lava') return;

            // Animate embers floating up
            embers.forEach(ember => {
                ember.position.y += ember.userData.speed * 0.01;
                ember.position.x += Math.sin(time * 2 + ember.userData.drift * 10) * 0.002;

                // Reset when too high
                if (ember.position.y > 6) {
                    ember.position.y = 0;
                    ember.position.x = (Math.random() - 0.5) * 6;
                    ember.position.z = (Math.random() - 0.5) * 6;
                }
            });

            // Pulse lava glow
            const pulse = Math.sin(time * 2) * 0.5 + 1.5;
            lavaMaterial.emissiveIntensity = pulse;
        }

        // Animate amber drift world - unhurried, gentle movements
        function animateDriftWorld(time) {
            if (currentWorld !== 'drift') return;

            // Dust motes - slow, meandering drift
            dustMotes.forEach(dust => {
                const d = dust.userData;
                // Very slow vertical drift
                dust.position.y = d.baseY + Math.sin(time * d.driftSpeed + d.driftPhase) * 0.3;
                // Gentle horizontal sway
                dust.position.x += Math.sin(time * d.swaySpeed + d.driftPhase) * 0.001 * d.swayAmount;
                dust.position.z += Math.cos(time * d.swaySpeed * 0.7 + d.driftPhase) * 0.001 * d.swayAmount;

                // Soft boundaries - gently redirect if wandering too far
                if (Math.abs(dust.position.x) > 5) dust.position.x *= 0.99;
                if (Math.abs(dust.position.z) > 5) dust.position.z *= 0.99;
            });

            // Floating stones - low gravity, contemplative bobbing
            floatingStones.forEach(stone => {
                const s = stone.userData;
                // Slow, gentle float
                stone.position.y = s.baseY + Math.sin(time * s.floatSpeed + s.floatPhase) * s.floatAmount;
                // Very slow rotation - like turning an idea over
                stone.rotation.y += s.rotateSpeed * 0.005;
                stone.rotation.x += s.rotateSpeed * 0.002;
            });

            // Subtle light shaft breathing
            lightShaft.material.opacity = 0.04 + Math.sin(time * 0.3) * 0.02;
        }

        // Animate glade world - nature, flora and fauna
        function animateGladeWorld(time, deltaTime) {
            if (currentWorld !== 'glade') return;

            // Grass swaying
            grassBlades.forEach(blade => {
                const b = blade.userData;
                blade.rotation.z = Math.sin(time * b.swaySpeed + b.swayPhase) * 0.15;
            });

            // Flowers swaying gently
            flowers.forEach(flower => {
                flower.rotation.z = Math.sin(time * 0.8 + flower.userData.swayPhase) * 0.05;
            });

            // Butterflies - fluttering around
            butterflies.forEach(butterfly => {
                const b = butterfly.userData;

                // Wing flapping
                const flap = Math.sin(time * b.flapSpeed) * 0.8;
                b.leftWing.rotation.y = -0.3 - flap;
                b.rightWing.rotation.y = Math.PI + 0.3 + flap;

                // Circular path with vertical bobbing
                const pathAngle = time * b.pathSpeed + b.pathPhase;
                butterfly.position.x = Math.cos(pathAngle) * b.pathRadius;
                butterfly.position.z = Math.sin(pathAngle) * b.pathRadius;
                butterfly.position.y = b.baseY + Math.sin(time * b.bobSpeed + b.bobPhase) * 0.3;

                // Face direction of travel
                butterfly.rotation.y = -pathAngle + Math.PI / 2;
            });

            // Bees - buzzing around, visiting flowers
            bees.forEach(bee => {
                const b = bee.userData;

                // Wing buzzing
                const buzz = Math.sin(time * 30) * 0.4;
                b.leftWing.rotation.z = 0.3 + buzz;
                b.rightWing.rotation.z = -0.3 - buzz;

                if (b.state === 'flying') {
                    // Pick a flower to visit
                    if (!b.targetFlower && flowers.length > 0) {
                        b.targetFlower = flowers[Math.floor(Math.random() * flowers.length)];
                    }

                    if (b.targetFlower) {
                        const target = b.targetFlower.position;
                        const dx = target.x - bee.position.x;
                        const dy = (target.y + 0.4) - bee.position.y;
                        const dz = target.z - bee.position.z;
                        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                        if (dist > 0.2) {
                            bee.position.x += (dx / dist) * b.speed * deltaTime;
                            bee.position.y += (dy / dist) * b.speed * deltaTime;
                            bee.position.z += (dz / dist) * b.speed * deltaTime;
                            bee.lookAt(target.x, target.y + 0.4, target.z);
                        } else {
                            b.state = 'hovering';
                            b.hoverTime = 1 + Math.random() * 2;
                        }
                    }
                } else if (b.state === 'hovering') {
                    // Hover near flower
                    bee.position.y += Math.sin(time * 5) * 0.002;
                    b.hoverTime -= deltaTime;
                    if (b.hoverTime <= 0) {
                        b.state = 'flying';
                        b.targetFlower = null;
                    }
                }
            });

            // Rabbits - occasional hopping
            rabbits.forEach(rabbit => {
                const r = rabbit.userData;
                const hop = Math.sin(time * r.hopSpeed + r.hopPhase);
                if (hop > 0.9) {
                    rabbit.position.y = (hop - 0.9) * 0.5;
                } else {
                    rabbit.position.y = 0;
                }
            });

            // Fish swimming in circles
            fish.forEach(f => {
                const fd = f.userData;
                fd.angle += fd.speed * deltaTime;
                f.position.x = 2 + Math.cos(fd.angle) * fd.radius;
                f.position.z = -2 + Math.sin(fd.angle) * fd.radius;
                f.rotation.y = -fd.angle + Math.PI / 2;
            });

            // Pond ripples (subtle scale pulse)
            pond.scale.x = 1 + Math.sin(time * 0.5) * 0.02;
            pond.scale.y = 1 + Math.sin(time * 0.5) * 0.02;
        }

        // Animate abyss world - deep ocean bioluminescence
        function animateAbyssWorld(time, deltaTime) {
            if (currentWorld !== 'abyss') return;

            // Bioluminescent particles - gentle drifting and pulsing
            bioParticles.forEach(bio => {
                if (!bio.userData || !bio.userData.basePos) return;
                const b = bio.userData;
                // Slow drift motion
                bio.position.x = b.basePos.x + Math.sin(time * b.driftSpeed + b.driftPhase) * 0.3;
                bio.position.y = b.basePos.y + Math.sin(time * b.driftSpeed * 0.7 + b.driftPhase) * 0.2;
                bio.position.z = b.basePos.z + Math.cos(time * b.driftSpeed * 0.8 + b.driftPhase) * 0.3;
                // Pulsing glow
                if (bio.material) bio.material.opacity = 0.4 + Math.sin(time * b.pulseSpeed) * 0.4;
            });

            // Jellyfish - graceful pulsing and drifting
            jellyfish.forEach(jelly => {
                if (!jelly.userData) return;
                const j = jelly.userData;

                // Vertical bobbing
                jelly.position.y = j.baseY + Math.sin(time * j.bobSpeed + j.bobPhase) * j.bobAmount;

                // Slow horizontal drift
                jelly.position.x += Math.sin(j.driftAngle) * j.driftSpeed * deltaTime;
                jelly.position.z += Math.cos(j.driftAngle) * j.driftSpeed * deltaTime;

                // Keep jellyfish in bounds
                const dist = Math.sqrt(jelly.position.x * jelly.position.x + jelly.position.z * jelly.position.z);
                if (dist > 6) {
                    j.driftAngle += Math.PI; // Turn around
                }

                // Bell pulsing animation
                if (j.bell) {
                    const pulse = Math.sin(time * 2 + j.pulsePhase);
                    j.bell.scale.x = 1 + pulse * 0.1;
                    j.bell.scale.z = 1 + pulse * 0.1;
                    j.bell.scale.y = 1 - pulse * 0.15;
                }

                // Tentacle swaying
                if (j.tentacles) {
                    j.tentacles.forEach(tent => {
                        if (!tent.userData) return;
                        const t = tent.userData;
                        tent.rotation.x = Math.sin(time * 1.5 + t.swayPhase) * 0.3;
                        tent.rotation.z = Math.cos(time * 1.2 + t.swayPhase) * 0.2;
                    });
                }
            });

            // Seaweed swaying with current
            seaweeds.forEach(seaweed => {
                if (!seaweed.userData) return;
                const s = seaweed.userData;
                seaweed.children.forEach(seg => {
                    const idx = (seg.userData && seg.userData.segmentIndex) || 0;
                    // More sway at the top
                    const swayAmount = (idx + 1) * 0.08;
                    seg.rotation.z = Math.sin(time * s.swaySpeed + s.swayPhase + idx * 0.3) * swayAmount;
                });
            });

            // Bubbles rising
            bubbles.forEach(bubble => {
                if (!bubble.userData) return;
                const b = bubble.userData;
                bubble.position.y += b.riseSpeed * deltaTime;
                // Wobble side to side
                bubble.position.x = b.baseX + Math.sin(time * b.wobbleSpeed + b.wobblePhase) * b.wobbleAmount;
                bubble.position.z = b.baseZ + Math.cos(time * b.wobbleSpeed * 0.8 + b.wobblePhase) * b.wobbleAmount;

                // Reset at top
                if (bubble.position.y > 7) {
                    bubble.position.y = 0;
                    b.baseX = (Math.random() - 0.5) * 12;
                    b.baseZ = (Math.random() - 0.5) * 12;
                    bubble.position.x = b.baseX;
                    bubble.position.z = b.baseZ;
                }
            });

            // Giant eye - slowly tracking the sphere/panda
            if (!currentCharacter || !currentCharacter.group) return;
            const targetPos = currentCharacter.group.position;

            // Calculate direction to target
            const dx = targetPos.x - giantEye.position.x;
            const dy = targetPos.y - giantEye.position.y;
            const dz = targetPos.z - giantEye.position.z;

            // Slowly rotate to face target
            const targetRotY = Math.atan2(dx, dz);
            giantEye.rotation.y += (targetRotY - giantEye.rotation.y) * 0.02;

            // Move pupil/iris to track (limited range)
            if (giantEye.userData && giantEye.userData.iris && giantEye.userData.pupil) {
                const lookX = Math.max(-0.5, Math.min(0.5, dx * 0.1));
                const lookY = Math.max(-0.3, Math.min(0.3, dy * 0.1));
                giantEye.userData.iris.position.x = lookX;
                giantEye.userData.iris.position.y = lookY;
                giantEye.userData.pupil.position.x = lookX;
                giantEye.userData.pupil.position.y = lookY;

                // Occasional blink (scale iris/pupil to simulate)
                const blinkCycle = Math.sin(time * 0.3);
                if (blinkCycle > 0.98) {
                    giantEye.userData.iris.scale.y = 0.1;
                    giantEye.userData.pupil.scale.y = 0.1;
                } else {
                    giantEye.userData.iris.scale.y = 1;
                    giantEye.userData.pupil.scale.y = 1;
                }
            }
        }

        // Animate melancholy world - gentle sadness, rain
        function animateMelancholyWorld(time, deltaTime) {
            if (currentWorld !== 'melancholy') return;

            // Rain falling
            raindrops.forEach(rain => {
                rain.position.y -= rain.userData.speed * deltaTime;
                if (rain.position.y < 0) {
                    rain.position.y = 10;
                    rain.position.x = (Math.random() - 0.5) * 16;
                    rain.position.z = (Math.random() - 0.5) * 16;
                }
            });

            // Puddle ripples
            puddles.forEach(puddle => {
                const ripple = Math.sin(time * 3 + puddle.userData.ripplePhase);
                puddle.scale.x = 1 + ripple * 0.03;
                puddle.scale.y = 1 + ripple * 0.03;
            });

            // Fog drifting
            melancholyWorld.children.forEach(child => {
                if (child.userData && child.userData.driftPhase !== undefined) {
                    child.position.x = Math.sin(time * 0.1 + child.userData.driftPhase) * 2;
                }
            });
        }

        // Animate euphoria world - celebration, joy
        function animateEuphoriaWorld(time, deltaTime) {
            if (currentWorld !== 'euphoria') return;

            // Confetti falling and spinning
            confetti.forEach(conf => {
                const c = conf.userData;
                conf.position.y -= c.fallSpeed * deltaTime;
                conf.position.x += Math.sin(time * 2 + c.swayPhase) * 0.01;
                conf.rotation.x += c.spinSpeed * deltaTime;
                conf.rotation.y += c.spinSpeed * 0.7 * deltaTime;

                if (conf.position.y < 0) {
                    conf.position.y = 8;
                    conf.position.x = (Math.random() - 0.5) * 14;
                    conf.position.z = (Math.random() - 0.5) * 14;
                }
            });

            // Balloons bobbing
            balloons.forEach(balloon => {
                const b = balloon.userData;
                balloon.position.y = b.baseY + Math.sin(time * b.bobSpeed + b.bobPhase) * 0.3;
                balloon.rotation.z = Math.sin(time * 0.5 + b.bobPhase) * 0.1;
            });

            // Sparkles pulsing
            sparkles.forEach(sparkle => {
                const s = sparkle.userData;
                const pulse = Math.sin(time * s.pulseSpeed + s.pulsePhase);
                sparkle.scale.setScalar(0.5 + pulse * 0.5);
                sparkle.material.opacity = 0.4 + pulse * 0.4;
                sparkle.rotation.y += deltaTime * 2;
            });

            // Smiley face gentle pulse
            smileyGroup.scale.setScalar(1 + Math.sin(time) * 0.02);
        }

        // Animate tension world - suspense, unease
        function animateTensionWorld(time, deltaTime) {
            if (currentWorld !== 'tension') return;

            // Watching eyes blinking and tracking
            watchingEyes.forEach(eyeGroup => {
                const e = eyeGroup.userData;
                const blink = Math.sin(time * e.blinkSpeed + e.blinkPhase);

                // Occasional blink
                if (blink > 0.95) {
                    eyeGroup.children.forEach(eye => {
                        eye.scale.y = 0.1;
                    });
                } else {
                    eyeGroup.children.forEach(eye => {
                        eye.scale.y = 1;
                    });
                }

                // Slowly track center/character
                eyeGroup.lookAt(0, 1, 0);

                // Pulsing intensity
                eyeGroup.children.forEach(eye => {
                    if (eye.material) {
                        eye.material.opacity = 0.5 + Math.sin(time * 2 + e.blinkPhase) * 0.3;
                    }
                });
            });

            // Flickering lights
            flickerLights.forEach(light => {
                const f = light.userData;
                const flicker = Math.sin(time * f.flickerSpeed + f.flickerPhase);
                light.material.opacity = flicker > 0 ? 0.9 : 0.2;
                light.scale.setScalar(0.8 + flicker * 0.4);
            });

            // Tendrils swaying menacingly
            tensionWorld.children.forEach(child => {
                if (child.userData && child.userData.swayPhase !== undefined && child.userData.swaySpeed) {
                    child.rotation.x = Math.sin(time * child.userData.swaySpeed + child.userData.swayPhase) * 0.2;
                    child.rotation.z = Math.cos(time * child.userData.swaySpeed * 0.7 + child.userData.swayPhase) * 0.15;
                }
            });

            // Tension light flickering
            if (tensionLight.visible) {
                tensionLight.intensity = 0.2 + Math.random() * 0.2;
            }
        }

        // Animate serenity world - calm, peace
        function animateSerenityWorld(time, deltaTime) {
            if (currentWorld !== 'serenity') return;

            // Lotus flowers gently floating
            lotusFlowers.forEach(lotus => {
                const l = lotus.userData;
                lotus.position.y = 0.02 + Math.sin(time * l.floatSpeed + l.floatPhase) * 0.02;
                lotus.rotation.y = Math.sin(time * 0.1 + l.floatPhase) * 0.05;
            });

            // Calm orbs floating
            calmOrbs.forEach(orb => {
                const o = orb.userData;
                orb.position.x = o.basePos.x + Math.sin(time * o.floatSpeed + o.floatPhase) * 0.3;
                orb.position.y = o.basePos.y + Math.sin(time * o.floatSpeed * 0.7 + o.floatPhase) * 0.2;
                orb.position.z = o.basePos.z + Math.cos(time * o.floatSpeed * 0.5 + o.floatPhase) * 0.3;
            });

            // Wind chimes gentle sway
            chimeGroup.children.forEach(chime => {
                if (chime.userData && chime.userData.swingPhase !== undefined) {
                    chime.rotation.z = Math.sin(time * 0.5 + chime.userData.swingPhase) * 0.1;
                }
            });

            // Gentle breathing of the scene
            serenityLight.intensity = 0.35 + Math.sin(time * 0.3) * 0.05;
        }

        // Animate simmer world - frustrated, things won't behave
        function animateSimmerWorld(time, deltaTime) {
            if (currentWorld !== 'simmer') return;

            // Scattered objects - restless, won't stay put
            scatteredObjects.forEach(obj => {
                const o = obj.userData;

                // Random scatter impulses - like a kid just kicked them
                o.scatterTimer -= deltaTime;
                if (o.scatterTimer <= 0) {
                    o.velocity.x += (Math.random() - 0.5) * o.restlessness * 0.5;
                    o.velocity.z += (Math.random() - 0.5) * o.restlessness * 0.5;
                    o.velocity.y += Math.random() * 0.2;
                    o.angularVel.x += (Math.random() - 0.5) * 3;
                    o.angularVel.y += (Math.random() - 0.5) * 3;
                    o.scatterTimer = 1 + Math.random() * 4;
                }

                // Apply velocity
                obj.position.add(o.velocity.clone().multiplyScalar(deltaTime * 2));

                // Gravity
                if (obj.position.y > 0.15) {
                    o.velocity.y -= 2 * deltaTime;
                } else {
                    obj.position.y = 0.15;
                    o.velocity.y = 0;
                    // Friction
                    o.velocity.x *= 0.95;
                    o.velocity.z *= 0.95;
                }

                // Bounce off boundaries
                if (Math.abs(obj.position.x) > 4) {
                    o.velocity.x *= -0.7;
                    obj.position.x = Math.sign(obj.position.x) * 4;
                }
                if (Math.abs(obj.position.z) > 4) {
                    o.velocity.z *= -0.7;
                    obj.position.z = Math.sign(obj.position.z) * 4;
                }

                // Spin
                obj.rotation.x += o.angularVel.x * deltaTime;
                obj.rotation.y += o.angularVel.y * deltaTime;
                obj.rotation.z += o.angularVel.z * deltaTime;

                // Angular friction
                o.angularVel.multiplyScalar(0.99);
            });

            // Heat waves - pulses of frustration
            heatWaves.forEach(wave => {
                if (!wave.visible && Math.random() < 0.02) {
                    wave.visible = true;
                    wave.position.x = (Math.random() - 0.5) * 4;
                    wave.position.z = (Math.random() - 0.5) * 4;
                    wave.userData.scale = 0.5;
                    wave.userData.life = 1;
                    wave.scale.set(0.5, 0.5, 0.5);
                }

                if (wave.visible) {
                    wave.userData.scale += deltaTime * 3;
                    wave.userData.life -= deltaTime * 1.5;
                    wave.scale.set(wave.userData.scale, wave.userData.scale, 1);
                    wave.material.opacity = wave.userData.life * 0.2;

                    if (wave.userData.life <= 0) {
                        wave.visible = false;
                    }
                }
            });

            // Pressure core - pulsing, building
            const pressure = Math.sin(time * 4) * 0.2 + 1;
            pressureCore.scale.set(pressure, pressure, pressure);
            pressureCore.material.emissiveIntensity = 0.3 + Math.sin(time * 6) * 0.3;
            pressureCore.rotation.y += deltaTime * 2;
            pressureCore.rotation.x = Math.sin(time * 3) * 0.2;

            // Steam particles - rising frustration
            steamParticles.forEach(steam => {
                if (!steam.visible && Math.random() < 0.1) {
                    steam.visible = true;
                    steam.position.set(
                        (Math.random() - 0.5) * 0.8,
                        2.3,
                        (Math.random() - 0.5) * 0.8
                    );
                    steam.material.opacity = 0.5;
                }

                if (steam.visible) {
                    steam.position.y += steam.userData.speed * deltaTime;
                    steam.position.x += steam.userData.drift * deltaTime;
                    steam.material.opacity -= deltaTime * 0.3;

                    if (steam.position.y > 5 || steam.material.opacity <= 0) {
                        steam.visible = false;
                    }
                }
            });

            // Light flickers with anger
            simmerLight.intensity = 1.5 + Math.sin(time * 8) * 0.3;
        }

        // Animate hearth world - cozy, warm, gentle breathing
        function animateHearthWorld(time) {
            if (currentWorld !== 'hearth') return;

            // Glowing orbs - gentle pulse like candlelight
            glowOrbs.forEach(orb => {
                const o = orb.userData;
                const pulse = Math.sin(time * o.pulseSpeed + o.pulsePhase) * 0.15 + 0.85;
                orb.material.opacity = o.baseOpacity * pulse;
                orb.scale.setScalar(1 + (pulse - 0.85) * 0.3);
            });

            // Family cluster - gentle breathing together
            const breathe = Math.sin(time * 0.8) * 0.02;
            familyGroup.position.y = breathe;
            familyGroup.rotation.y = Math.sin(time * 0.2) * 0.03;

            // Kids snuggle closer occasionally
            kid1.position.z = 0.4 + Math.sin(time * 0.5) * 0.03;
            kid2.position.x = -0.25 + Math.sin(time * 0.4) * 0.02;

            // Motes - very slow, peaceful drift
            hearthMotes.forEach(mote => {
                const m = mote.userData;
                mote.position.y = m.baseY + Math.sin(time * m.floatSpeed + m.floatPhase) * 0.2;
            });

            // Central glow - warm fireplace flicker
            const flicker = Math.sin(time * 3) * 0.1 + Math.sin(time * 7) * 0.05 + 1;
            centralGlow.intensity = 1.3 * flicker;
        }

        // Animate voltage world - restless, buzzing, overcaffeinated
        function animateVoltageWorld(time, deltaTime) {
            if (currentWorld !== 'voltage') return;

            // Spinners - fast, uneven, jittery
            spinners.forEach(spinner => {
                const s = spinner.userData;

                // Base spinning
                spinner.rotation.x += s.spinSpeedX * deltaTime;
                spinner.rotation.y += s.spinSpeedY * deltaTime;
                spinner.rotation.z += s.spinSpeedZ * deltaTime;

                // Constant jitter - can't sit still
                spinner.position.x = s.basePos.x + (Math.random() - 0.5) * s.jitterAmount;
                spinner.position.y = s.basePos.y + (Math.random() - 0.5) * s.jitterAmount;
                spinner.position.z = s.basePos.z + (Math.random() - 0.5) * s.jitterAmount;

                // Sudden acceleration bursts
                s.burstTimer -= deltaTime;
                if (s.burstTimer <= 0) {
                    s.spinSpeedX *= 1.5 + Math.random();
                    s.spinSpeedY *= 1.5 + Math.random();
                    s.burstTimer = s.burstCooldown;
                    // Decay back
                    setTimeout(() => {
                        s.spinSpeedX *= 0.6;
                        s.spinSpeedY *= 0.6;
                    }, 200);
                }
            });

            // Sparks - erratic, snapping
            sparks.forEach(spark => {
                const s = spark.userData;

                if (!spark.visible && Math.random() < 0.05) {
                    // Spawn new spark
                    spark.visible = true;
                    spark.position.set(
                        (Math.random() - 0.5) * 8,
                        Math.random() * 4 + 0.5,
                        (Math.random() - 0.5) * 8
                    );
                    s.velocity.set(
                        (Math.random() - 0.5) * 0.4,
                        (Math.random() - 0.5) * 0.4,
                        (Math.random() - 0.5) * 0.4
                    );
                    s.life = 0;
                    spark.material.opacity = 1;
                }

                if (spark.visible) {
                    s.life += deltaTime;
                    spark.position.add(s.velocity);
                    s.velocity.multiplyScalar(0.95);

                    // Erratic direction changes
                    if (Math.random() < 0.1) {
                        s.velocity.x += (Math.random() - 0.5) * 0.2;
                        s.velocity.y += (Math.random() - 0.5) * 0.2;
                        s.velocity.z += (Math.random() - 0.5) * 0.2;
                    }

                    spark.material.opacity = 1 - (s.life / s.maxLife);

                    if (s.life >= s.maxLife) {
                        spark.visible = false;
                    }
                }
            });

            // Lightning bolts - brief flashes
            bolts.forEach(bolt => {
                if (!bolt.visible && Math.random() < 0.008) {
                    // Regenerate bolt path
                    const points = [];
                    let y = 5;
                    let x = (Math.random() - 0.5) * 6;
                    let z = (Math.random() - 0.5) * 6;

                    while (y > 0) {
                        points.push(new THREE.Vector3(x, y, z));
                        y -= 0.3 + Math.random() * 0.4;
                        x += (Math.random() - 0.5) * 0.8;
                        z += (Math.random() - 0.5) * 0.8;
                    }

                    bolt.geometry.setFromPoints(points);
                    bolt.visible = true;
                    bolt.userData.life = 0.05 + Math.random() * 0.08;
                    bolt.material.opacity = 1;
                }

                if (bolt.visible) {
                    bolt.userData.life -= deltaTime;
                    bolt.material.opacity = bolt.userData.life * 10;
                    if (bolt.userData.life <= 0) {
                        bolt.visible = false;
                    }
                }
            });

            // Screens - flickering, glitching
            screens.forEach(screen => {
                const s = screen.userData;

                // Base flicker
                const flicker = Math.sin(time * s.flickerSpeed) * 0.2 + 0.8;
                screen.material.opacity = s.baseOpacity * flicker;

                // Random glitches
                if (Math.random() < s.glitchChance) {
                    screen.material.color.setHSL(Math.random(), 0.8, 0.5);
                    screen.material.opacity = 1;
                } else {
                    screen.material.color.setHSL(s.hue, 0.7, 0.5);
                }

                // Slight position jitter
                screen.position.x += (Math.random() - 0.5) * 0.005;
            });

            // Overhead light - that humming flicker
            const hum = Math.sin(time * 120) * 0.1 + Math.sin(time * 60) * 0.05;
            overheadLight.intensity = 2 + hum + (Math.random() < 0.02 ? -0.5 : 0);
            fixture.material.color.setHSL(0.15, 0.1, 0.9 + hum * 0.5);
        }
