<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Style Panda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #controls select {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #controls select:hover {
            background: white;
        }
        #controls label {
            display: block;
            margin-bottom: 6px;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="info">🐼 Nintendo Style Panda<br><small>Drag to rotate • Scroll to zoom</small></div>
    <div id="controls">
        <label>World</label>
        <select id="worldSelect">
            <option value="bamboo">Calm Bamboo</option>
            <option value="lava">Lava</option>
            <option value="drift">Amber Drift</option>
            <option value="voltage">Voltage</option>
            <option value="hearth">Hearth</option>
            <option value="simmer">Simmer</option>
            <option value="glade">Forest Glade</option>
        </select>
        <label style="margin-top: 12px;">Character</label>
        <select id="characterSelect">
            <option value="panda">Panda</option>
            <option value="sphere">Sphere</option>
        </select>
        <label style="margin-top: 12px;">Reflection Mode</label>
        <select id="reflectionMode">
            <option value="realtime">Crisp (CubeCamera)</option>
            <option value="gradient">Soft (Gradient)</option>
            <option value="ssr">Screen Space (SSR)</option>
        </select>
        <label style="margin-top: 12px;">Mirror Parts</label>
        <select id="mirrorParts">
            <option value="body">Body Only</option>
            <option value="all">All Parts</option>
        </select>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="morphToggle" style="margin-right: 6px;">
            Morph Mode
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="addMaterialToggle" style="margin-right: 6px;">
            Add Material Mode
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="birdsToggle" style="margin-right: 6px;">
            Chaotic Birds
        </label>
        <label style="margin-top: 12px;">Orbiting Orb</label>
        <select id="orbitOrbSelect">
            <option value="none">None</option>
            <option value="same">Same Camera</option>
            <option value="own">Own Camera</option>
            <option value="bubble">Bubble (Refract)</option>
        </select>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="floatModeToggle" style="margin-right: 6px;">
            Tap to Float
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="birdCollisionToggle" style="margin-right: 6px;">
            Bird Collisions
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="auraToggle" style="margin-right: 6px;">
            Energy Aura
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="cameraCreatureToggle" style="margin-right: 6px;">
            Camera Creature
        </label>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { SSRPass } from 'three/addons/postprocessing/SSRPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        // Generate gradient environment for soft reflections
        function createGradientEnvironment() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 0, 1024);
            gradient.addColorStop(0, '#1e90ff');
            gradient.addColorStop(0.35, '#87ceeb');
            gradient.addColorStop(0.5, '#ffffff');
            gradient.addColorStop(0.65, '#90ee90');
            gradient.addColorStop(1, '#228b22');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1024);

            // Add clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 350;
                const r = 30 + Math.random() * 60;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }

        const gradientEnvMap = createGradientEnvironment();

        // Reflection mode state
        let reflectionMode = 'realtime'; // 'realtime', 'gradient', 'ssr'

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0;
        controls.maxDistance = 30;
        controls.target.set(0, 1.5, 0);

        // Lighting - attached to camera so it follows the view
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // Add camera to scene so its child lights are rendered
        scene.add(camera);

        // Key light - front right, attached to camera
        const keyLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        keyLight.position.set(3, 5, 2);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -10;
        keyLight.shadow.camera.right = 10;
        keyLight.shadow.camera.top = 10;
        keyLight.shadow.camera.bottom = -10;
        camera.add(keyLight);

        // Fill light - left side, attached to camera
        const fillLight = new THREE.DirectionalLight(0x8ec8ff, 0.6);
        fillLight.position.set(-4, 3, 1);
        camera.add(fillLight);

        // Rim light - behind, attached to camera
        const rimLight = new THREE.DirectionalLight(0xffddaa, 0.8);
        rimLight.position.set(0, 2, -5);
        camera.add(rimLight);

        // ============================================
        // CUSTOM MESH CREATION UTILITIES
        // ============================================

        // Smooth a geometry by merging vertices and recomputing normals
        function smoothGeometry(geometry) {
            geometry = mergeVertices(geometry);
            geometry.computeVertexNormals();
            return geometry;
        }

        // Create a smooth mesh from control points using Catmull-Rom subdivision
        function createSmoothMesh(profile, segments, radialSegments, material) {
            const points = [];

            // Catmull-Rom interpolation for smooth curves
            for (let i = 0; i < profile.length - 1; i++) {
                const p0 = profile[Math.max(0, i - 1)];
                const p1 = profile[i];
                const p2 = profile[Math.min(profile.length - 1, i + 1)];
                const p3 = profile[Math.min(profile.length - 1, i + 2)];

                for (let t = 0; t < segments; t++) {
                    const s = t / segments;
                    const tt = s * s;
                    const ttt = tt * s;

                    const q0 = -ttt + 2*tt - s;
                    const q1 = 3*ttt - 5*tt + 2;
                    const q2 = -3*ttt + 4*tt + s;
                    const q3 = ttt - tt;

                    points.push(new THREE.Vector2(
                        0.5 * (p0.x*q0 + p1.x*q1 + p2.x*q2 + p3.x*q3),
                        0.5 * (p0.y*q0 + p1.y*q1 + p2.y*q2 + p3.y*q3)
                    ));
                }
            }
            points.push(profile[profile.length - 1]);

            const geometry = new THREE.LatheGeometry(points, radialSegments);
            return new THREE.Mesh(geometry, material);
        }

        // Create mesh from vertices and indices
        function createCustomMesh(vertices, indices, material, computeNormals = true) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            if (computeNormals) {
                geometry.computeVertexNormals();
            }
            return new THREE.Mesh(geometry, material);
        }

        // Subdivide and smooth a mesh
        function subdivideMesh(geometry, iterations = 1) {
            for (let iter = 0; iter < iterations; iter++) {
                const positions = geometry.attributes.position.array;
                const indices = geometry.index ? Array.from(geometry.index.array) : null;

                if (!indices) continue;

                const newPositions = [...positions];
                const newIndices = [];
                const edgeMidpoints = new Map();

                function getEdgeKey(i1, i2) {
                    return i1 < i2 ? `${i1}_${i2}` : `${i2}_${i1}`;
                }

                function getMidpoint(i1, i2) {
                    const key = getEdgeKey(i1, i2);
                    if (edgeMidpoints.has(key)) {
                        return edgeMidpoints.get(key);
                    }

                    const newIndex = newPositions.length / 3;
                    newPositions.push(
                        (positions[i1*3] + positions[i2*3]) / 2,
                        (positions[i1*3+1] + positions[i2*3+1]) / 2,
                        (positions[i1*3+2] + positions[i2*3+2]) / 2
                    );
                    edgeMidpoints.set(key, newIndex);
                    return newIndex;
                }

                for (let i = 0; i < indices.length; i += 3) {
                    const a = indices[i];
                    const b = indices[i+1];
                    const c = indices[i+2];

                    const ab = getMidpoint(a, b);
                    const bc = getMidpoint(b, c);
                    const ca = getMidpoint(c, a);

                    newIndices.push(a, ab, ca);
                    newIndices.push(b, bc, ab);
                    newIndices.push(c, ca, bc);
                    newIndices.push(ab, bc, ca);
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(newPositions, 3));
                geometry.setIndex(newIndices);
            }

            geometry.computeVertexNormals();
            return geometry;
        }

        // ============================================
        // PANDA MESH CREATION
        // ============================================

        // Materials
        const whiteFurMaterial = new THREE.MeshStandardMaterial({
            color: 0xf5f5f5,
            roughness: 0.7,
            metalness: 0.0,
        });

        // CubeCamera for real-time reflections
        const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512, {
            format: THREE.RGBAFormat,
            generateMipmaps: true,
            minFilter: THREE.LinearMipmapLinearFilter,
        });
        const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget);
        cubeCamera.position.set(0, 1.5, 0);
        scene.add(cubeCamera);

        // Mirror material for body - uses CubeCamera for crisp reflections
        const mirrorMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.0,
            metalness: 1.0,
            envMap: cubeRenderTarget.texture,
            envMapIntensity: 1.5,
        });

        const blackFurMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.8,
            metalness: 0.0,
        });

        const noseMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111,
            roughness: 0.3,
            metalness: 0.1,
        });

        const eyeMaterial = new THREE.MeshStandardMaterial({
            color: 0x000000,
            roughness: 0.0,
            metalness: 0.3,
        });

        const eyeHighlightMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
        });

        const cheekMaterial = new THREE.MeshStandardMaterial({
            color: 0xffb6c1,
            roughness: 0.9,
            metalness: 0.0,
            transparent: true,
            opacity: 0.6,
        });

        // ============================================
        // ENERGY AURA SHADER
        // ============================================
        const auraShader = {
            uniforms: {
                time: { value: 0 },
                color1: { value: new THREE.Color(0x00ffff) },
                color2: { value: new THREE.Color(0xff00ff) },
                pulseSpeed: { value: 2.0 },
                noiseScale: { value: 3.0 },
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying float vDisplacement;
                uniform float time;
                uniform float noiseScale;

                // Simplex noise function
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy));
                    vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min(g.xyz, l.zxy);
                    vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute(permute(permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857;
                    vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_);
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4(x.xy, y.xy);
                    vec4 b1 = vec4(x.zw, y.zw);
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                    vec3 p0 = vec3(a0.xy, h.x);
                    vec3 p1 = vec3(a0.zw, h.y);
                    vec3 p2 = vec3(a1.xy, h.z);
                    vec3 p3 = vec3(a1.zw, h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                    p0 *= norm.x;
                    p1 *= norm.y;
                    p2 *= norm.z;
                    p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                }

                void main() {
                    vNormal = normalize(normalMatrix * normal);

                    // Animated noise displacement
                    float noise = snoise(position * noiseScale + time * 0.5);
                    float pulse = sin(time * 2.0) * 0.5 + 0.5;
                    vDisplacement = noise * 0.15 + pulse * 0.1;

                    // Push vertices outward along normal with noise
                    vec3 newPosition = position + normal * (0.15 + vDisplacement * 0.2);

                    vWorldPosition = (modelMatrix * vec4(newPosition, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying float vDisplacement;
                uniform float time;
                uniform vec3 color1;
                uniform vec3 color2;
                uniform float pulseSpeed;

                void main() {
                    // Fresnel for edge glow
                    vec3 viewDir = normalize(cameraPosition - vWorldPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 2.5);

                    // Pulsing color mix
                    float colorPulse = sin(time * pulseSpeed + vWorldPosition.y * 2.0) * 0.5 + 0.5;
                    vec3 auraColor = mix(color1, color2, colorPulse);

                    // Add energy flickers
                    float flicker = sin(time * 20.0 + vWorldPosition.y * 10.0) * 0.1 + 0.9;

                    // Combine
                    vec3 finalColor = auraColor * (fresnel * 2.0 + 0.3) * flicker;
                    finalColor += pow(fresnel, 4.0) * vec3(1.0); // Bright edge highlight

                    // Alpha - visible at edges, transparent in middle
                    float alpha = fresnel * 0.8 * flicker;
                    alpha += vDisplacement * 0.3;
                    alpha = clamp(alpha, 0.0, 0.9);

                    gl_FragColor = vec4(finalColor, alpha);
                }
            `
        };

        const auraMaterial = new THREE.ShaderMaterial({
            uniforms: auraShader.uniforms,
            vertexShader: auraShader.vertexShader,
            fragmentShader: auraShader.fragmentShader,
            transparent: true,
            side: THREE.BackSide, // Render inside-out so it surrounds the object
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        let auraEnabled = false;
        const auraMeshes = []; // Store aura meshes

        // ============================================
        // CAMERA CREATURE
        // ============================================
        const cameraCreature = new THREE.Group();

        // Creature body - ghostly blob shape
        const creatureBodyProfile = [
            new THREE.Vector2(0, 0),
            new THREE.Vector2(0.15, 0.05),
            new THREE.Vector2(0.25, 0.15),
            new THREE.Vector2(0.3, 0.3),
            new THREE.Vector2(0.32, 0.5),
            new THREE.Vector2(0.3, 0.7),
            new THREE.Vector2(0.25, 0.85),
            new THREE.Vector2(0.15, 0.95),
            new THREE.Vector2(0, 1.0),
        ];

        const creatureMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ddff,
            roughness: 0.3,
            metalness: 0.1,
            transparent: true,
            opacity: 0.85,
        });

        const creatureBody = createSmoothMesh(creatureBodyProfile, 6, 16, creatureMaterial);
        creatureBody.scale.set(1, 1.2, 0.8);
        cameraCreature.add(creatureBody);

        // Big cute eyes
        const creatureEyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const creatureEyePupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        function createCreatureEye(xPos) {
            const eyeGroup = new THREE.Group();

            let eyeWhiteGeo = new THREE.IcosahedronGeometry(0.1, 2);
            eyeWhiteGeo = smoothGeometry(eyeWhiteGeo);
            const eyeWhite = new THREE.Mesh(eyeWhiteGeo, creatureEyeWhiteMat);
            eyeWhite.scale.set(1, 1.2, 0.6);
            eyeGroup.add(eyeWhite);

            let pupilGeo = new THREE.IcosahedronGeometry(0.05, 2);
            pupilGeo = smoothGeometry(pupilGeo);
            const pupil = new THREE.Mesh(pupilGeo, creatureEyePupilMat);
            pupil.position.z = 0.05;
            eyeGroup.add(pupil);

            eyeGroup.position.set(xPos, 0.7, 0.2);
            return eyeGroup;
        }

        cameraCreature.add(createCreatureEye(-0.12));
        cameraCreature.add(createCreatureEye(0.12));

        // Little arms/tentacles
        const armMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ddff,
            roughness: 0.3,
            metalness: 0.1,
        });

        function createCreatureArm(xPos, zRot) {
            let armGeo = new THREE.CapsuleGeometry(0.04, 0.2, 4, 8);
            const arm = new THREE.Mesh(armGeo, armMaterial);
            arm.position.set(xPos, 0.4, 0.15);
            arm.rotation.z = zRot;
            arm.rotation.x = -0.3;
            return arm;
        }

        const creatureLeftArm = createCreatureArm(-0.25, 0.5);
        const creatureRightArm = createCreatureArm(0.25, -0.5);
        cameraCreature.add(creatureLeftArm);
        cameraCreature.add(creatureRightArm);

        // Position creature right behind camera, facing same direction
        cameraCreature.position.set(0, 0.2, 0.3);
        cameraCreature.rotation.y = Math.PI; // Face same direction as camera
        cameraCreature.visible = false;
        camera.add(cameraCreature);

        let cameraCreatureEnabled = false;

        const panda = new THREE.Group();

        // ============================================
        // BODY - Custom lathe mesh with panda body profile
        // ============================================
        const bodyProfile = [
            new THREE.Vector2(0, 0),        // bottom
            new THREE.Vector2(0.3, 0.1),
            new THREE.Vector2(0.7, 0.3),
            new THREE.Vector2(1.0, 0.6),
            new THREE.Vector2(1.15, 1.0),
            new THREE.Vector2(1.2, 1.4),    // widest part (belly)
            new THREE.Vector2(1.15, 1.8),
            new THREE.Vector2(1.0, 2.1),
            new THREE.Vector2(0.7, 2.3),
            new THREE.Vector2(0.3, 2.4),
            new THREE.Vector2(0, 2.45),     // top (connects to head)
        ];

        const body = createSmoothMesh(bodyProfile, 8, 32, mirrorMaterial);
        body.castShadow = true;
        body.receiveShadow = true;
        panda.add(body);

        // Black chest patch - using custom deformed geometry
        const chestPatchProfile = [
            new THREE.Vector2(0, 0.6),
            new THREE.Vector2(0.5, 0.65),
            new THREE.Vector2(0.85, 0.8),
            new THREE.Vector2(0.95, 1.2),
            new THREE.Vector2(0.85, 1.6),
            new THREE.Vector2(0.5, 1.75),
            new THREE.Vector2(0, 1.8),
        ];

        const chestPatch = createSmoothMesh(chestPatchProfile, 6, 32, blackFurMaterial);
        chestPatch.scale.set(1.05, 1, 0.3);
        chestPatch.position.z = -0.7;
        chestPatch.rotation.x = Math.PI;
        panda.add(chestPatch);

        // ============================================
        // HEAD - Custom mesh using icosahedron subdivision
        // ============================================
        let headGeometry = new THREE.IcosahedronGeometry(1, 4);

        // Deform to panda head shape (wider, flatter)
        const headPositions = headGeometry.attributes.position.array;
        for (let i = 0; i < headPositions.length; i += 3) {
            let x = headPositions[i];
            let y = headPositions[i + 1];
            let z = headPositions[i + 2];

            // Widen horizontally
            x *= 1.15;
            // Flatten slightly vertically
            y *= 0.95;
            // Push forward the front face (muzzle area)
            if (z > 0.3) {
                z *= 1.1 + (z * 0.15);
                // Lower muzzle area
                if (y < 0) {
                    z *= 1.15;

        // EYE PATCHES - Custom curved mesh
        // ============================================
        function createEyePatch(isLeft) {
            let geometry = new THREE.IcosahedronGeometry(0.4, 3);
            const positions = geometry.attributes.position.array;

            for (let i = 0; i < positions.length; i += 3) {
                let x = positions[i];
                let y = positions[i + 1];
                let z = positions[i + 2];

                // Elongate diagonally and flatten
                const angle = isLeft ? 0.4 : -0.4;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                const newX = x * cos - y * sin;
                const newY = x * sin + y * cos;

                y = newY * 1.5;
                z *= 0.4;

                positions[i + 1] = y;
                positions[i + 2] = z;

        // Switch character function
        function switchCharacter(characterType) {
            // Remove current character from scene
            scene.remove(currentCharacter.group);

            // Reset morph state
            morphEnabled = false;
            document.getElementById('morphToggle').checked = false;

            if (characterType === 'panda') {
                currentCharacter = pandaCharacter;
            } else if (characterType === 'sphere') {
                // Create sphere if not exists
                if (!sphereCharacter) {
                    sphereCharacter = createSphereCharacter();
                }
                currentCharacter = sphereCharacter;
            }

            // Add new character to scene
            scene.add(currentCharacter.group);

            // Update clickable meshes
            updateClickableMeshes();

            // Update morphable parts
            updateMorphableParts();

            // Update SSR selects
            ssrSelects.length = 0;
            ssrSelects.push(currentCharacter.body);

            // Reset mirror parts dropdown
            document.getElementById('mirrorParts').value = 'body';
            applyMirrorSetting('body');
        }

        function updateClickableMeshes() {
            clickableMeshes.length = 0;
            Object.values(currentCharacter.parts).forEach(mesh => {
                if (mesh) clickableMeshes.push(mesh);
            });
        }

        function updateMorphableParts() {
            morphableParts.length = 0;
            Object.values(currentCharacter.parts).forEach(mesh => {
                if (mesh && mesh.userData.originalPositions) {
                    morphableParts.push(mesh);
                } else if (mesh) {
                    storeMorphData(mesh);
                    morphableParts.push(mesh);
                }
            });
        }

        function applyMirrorSetting(mode) {
            const allMirror = (mode === 'all');
            Object.entries(currentCharacter.parts).forEach(([name, mesh]) => {
                if (!mesh) return;
                if (name === 'body') return; // Body always mirror

                // Determine original material based on part name
                let originalMat = whiteFurMaterial;
                if (name.includes('Ear') || name.includes('Arm') || name.includes('Paw') ||
                    name.includes('Leg') || name.includes('Foot') || name.includes('EyePatch') ||
                    name === 'chestPatch') {
                    originalMat = blackFurMaterial;
                } else if (name === 'nose') {
                    originalMat = noseMaterial;
                } else if (name.includes('Cheek')) {
                    originalMat = cheekMaterial;
                }

                mesh.material = allMirror ? mirrorMaterial : originalMat;
            });

                color: 0x4a7c23,
                roughness: 0.6,
                metalness: 0.1,
            });

            const stalkProfile = [];
            for (let i = 0; i <= segments; i++) {
                const y = i * 0.6;
                const r = 0.06 + Math.sin(i * Math.PI / segments) * 0.01;
                stalkProfile.push(new THREE.Vector2(r, y));

                if (i < segments) {
                    stalkProfile.push(new THREE.Vector2(r + 0.015, y + 0.55));
                    stalkProfile.push(new THREE.Vector2(r + 0.02, y + 0.58));
                    stalkProfile.push(new THREE.Vector2(r + 0.015, y + 0.6));

                color: 0x5a9c2e,
                roughness: 0.8,

                    0.02, 0.4, 0,

                bambooGroup.add(leaf);
            }

            bambooGroup.position.set(x, 0, z);
            return bambooGroup;

        // World switching function

        // Animate lava world elements
        function animateLavaWorld(time) {
            if (currentWorld !== 'lava') return;

            // Animate embers floating up
            embers.forEach(ember => {
                ember.position.y += ember.userData.speed * 0.01;
                ember.position.x += Math.sin(time * 2 + ember.userData.drift * 10) * 0.002;

                // Reset when too high
                if (ember.position.y > 6) {
                    ember.position.y = 0;
                    ember.position.x = (Math.random() - 0.5) * 6;
                    ember.position.z = (Math.random() - 0.5) * 6;
                }
            });

            // Pulse lava glow
            const pulse = Math.sin(time * 2) * 0.5 + 1.5;
            lavaMaterial.emissiveIntensity = pulse;
        }

        // Animate amber drift world - unhurried, gentle movements
        function animateDriftWorld(time) {
            if (currentWorld !== 'drift') return;

            // Dust motes - slow, meandering drift
            dustMotes.forEach(dust => {
                const d = dust.userData;
                // Very slow vertical drift
                dust.position.y = d.baseY + Math.sin(time * d.driftSpeed + d.driftPhase) * 0.3;
                // Gentle horizontal sway
                dust.position.x += Math.sin(time * d.swaySpeed + d.driftPhase) * 0.001 * d.swayAmount;
                dust.position.z += Math.cos(time * d.swaySpeed * 0.7 + d.driftPhase) * 0.001 * d.swayAmount;

                // Soft boundaries - gently redirect if wandering too far
                if (Math.abs(dust.position.x) > 5) dust.position.x *= 0.99;
                if (Math.abs(dust.position.z) > 5) dust.position.z *= 0.99;
            });

            // Floating stones - low gravity, contemplative bobbing
            floatingStones.forEach(stone => {
                const s = stone.userData;
                // Slow, gentle float
                stone.position.y = s.baseY + Math.sin(time * s.floatSpeed + s.floatPhase) * s.floatAmount;
                // Very slow rotation - like turning an idea over
                stone.rotation.y += s.rotateSpeed * 0.005;
                stone.rotation.x += s.rotateSpeed * 0.002;
            });

            // Subtle light shaft breathing
            lightShaft.material.opacity = 0.04 + Math.sin(time * 0.3) * 0.02;
        }

        // Animate glade world - nature, flora and fauna
        function animateGladeWorld(time, deltaTime) {
            if (currentWorld !== 'glade') return;

            // Grass swaying
            grassBlades.forEach(blade => {
                const b = blade.userData;
                blade.rotation.z = Math.sin(time * b.swaySpeed + b.swayPhase) * 0.15;
            });

            // Flowers swaying gently
            flowers.forEach(flower => {
                flower.rotation.z = Math.sin(time * 0.8 + flower.userData.swayPhase) * 0.05;
            });

            // Butterflies - fluttering around
            butterflies.forEach(butterfly => {
                const b = butterfly.userData;

                // Wing flapping
                const flap = Math.sin(time * b.flapSpeed) * 0.8;
                b.leftWing.rotation.y = -0.3 - flap;
                b.rightWing.rotation.y = Math.PI + 0.3 + flap;

                // Circular path with vertical bobbing
                const pathAngle = time * b.pathSpeed + b.pathPhase;
                butterfly.position.x = Math.cos(pathAngle) * b.pathRadius;
                butterfly.position.z = Math.sin(pathAngle) * b.pathRadius;
                butterfly.position.y = b.baseY + Math.sin(time * b.bobSpeed + b.bobPhase) * 0.3;

                // Face direction of travel
                butterfly.rotation.y = -pathAngle + Math.PI / 2;
            });

            // Bees - buzzing around, visiting flowers
            bees.forEach(bee => {
                const b = bee.userData;

                // Wing buzzing
                const buzz = Math.sin(time * 30) * 0.4;
                b.leftWing.rotation.z = 0.3 + buzz;
                b.rightWing.rotation.z = -0.3 - buzz;

                if (b.state === 'flying') {
                    // Pick a flower to visit
                    if (!b.targetFlower && flowers.length > 0) {
                        b.targetFlower = flowers[Math.floor(Math.random() * flowers.length)];
                    }

                    if (b.targetFlower) {
                        const target = b.targetFlower.position;
                        const dx = target.x - bee.position.x;
                        const dy = (target.y + 0.4) - bee.position.y;
                        const dz = target.z - bee.position.z;
                        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                        if (dist > 0.2) {
                            bee.position.x += (dx / dist) * b.speed * deltaTime;
                            bee.position.y += (dy / dist) * b.speed * deltaTime;
                            bee.position.z += (dz / dist) * b.speed * deltaTime;
                            bee.lookAt(target.x, target.y + 0.4, target.z);
                        } else {
                            b.state = 'hovering';
                            b.hoverTime = 1 + Math.random() * 2;
                        }
                    }
                } else if (b.state === 'hovering') {
                    // Hover near flower
                    bee.position.y += Math.sin(time * 5) * 0.002;
                    b.hoverTime -= deltaTime;
                    if (b.hoverTime <= 0) {
                        b.state = 'flying';
                        b.targetFlower = null;
                    }
                }
            });

            // Rabbits - occasional hopping
            rabbits.forEach(rabbit => {
                const r = rabbit.userData;
                const hop = Math.sin(time * r.hopSpeed + r.hopPhase);
                if (hop > 0.9) {
                    rabbit.position.y = (hop - 0.9) * 0.5;
                } else {
                    rabbit.position.y = 0;
                }
            });

            // Fish swimming in circles
            fish.forEach(f => {
                const fd = f.userData;
                fd.angle += fd.speed * deltaTime;
                f.position.x = 2 + Math.cos(fd.angle) * fd.radius;
                f.position.z = -2 + Math.sin(fd.angle) * fd.radius;
                f.rotation.y = -fd.angle + Math.PI / 2;
            });

            // Pond ripples (subtle scale pulse)
            pond.scale.x = 1 + Math.sin(time * 0.5) * 0.02;
            pond.scale.y = 1 + Math.sin(time * 0.5) * 0.02;
        }

        // Animate simmer world - frustrated, things won't behave
        function animateSimmerWorld(time, deltaTime) {
            if (currentWorld !== 'simmer') return;

            // Scattered objects - restless, won't stay put
            scatteredObjects.forEach(obj => {
                const o = obj.userData;

                // Random scatter impulses - like a kid just kicked them
                o.scatterTimer -= deltaTime;
                if (o.scatterTimer <= 0) {
                    o.velocity.x += (Math.random() - 0.5) * o.restlessness * 0.5;
                    o.velocity.z += (Math.random() - 0.5) * o.restlessness * 0.5;
                    o.velocity.y += Math.random() * 0.2;
                    o.angularVel.x += (Math.random() - 0.5) * 3;
                    o.angularVel.y += (Math.random() - 0.5) * 3;
                    o.scatterTimer = 1 + Math.random() * 4;
                }

                // Apply velocity
                obj.position.add(o.velocity.clone().multiplyScalar(deltaTime * 2));

                // Gravity
                if (obj.position.y > 0.15) {
                    o.velocity.y -= 2 * deltaTime;
                } else {
                    obj.position.y = 0.15;
                    o.velocity.y = 0;
                    // Friction
                    o.velocity.x *= 0.95;
                    o.velocity.z *= 0.95;
                }

                // Bounce off boundaries
                if (Math.abs(obj.position.x) > 4) {
                    o.velocity.x *= -0.7;
                    obj.position.x = Math.sign(obj.position.x) * 4;
                }
                if (Math.abs(obj.position.z) > 4) {
                    o.velocity.z *= -0.7;
                    obj.position.z = Math.sign(obj.position.z) * 4;
                }

                // Spin
                obj.rotation.x += o.angularVel.x * deltaTime;
                obj.rotation.y += o.angularVel.y * deltaTime;
                obj.rotation.z += o.angularVel.z * deltaTime;

                // Angular friction
                o.angularVel.multiplyScalar(0.99);
            });

            // Heat waves - pulses of frustration
            heatWaves.forEach(wave => {
                if (!wave.visible && Math.random() < 0.02) {
                    wave.visible = true;
                    wave.position.x = (Math.random() - 0.5) * 4;
                    wave.position.z = (Math.random() - 0.5) * 4;
                    wave.userData.scale = 0.5;
                    wave.userData.life = 1;
                    wave.scale.set(0.5, 0.5, 0.5);
                }

                if (wave.visible) {
                    wave.userData.scale += deltaTime * 3;
                    wave.userData.life -= deltaTime * 1.5;
                    wave.scale.set(wave.userData.scale, wave.userData.scale, 1);
                    wave.material.opacity = wave.userData.life * 0.2;

                    if (wave.userData.life <= 0) {
                        wave.visible = false;
                    }
                }
            });

            // Pressure core - pulsing, building
            const pressure = Math.sin(time * 4) * 0.2 + 1;
            pressureCore.scale.set(pressure, pressure, pressure);
            pressureCore.material.emissiveIntensity = 0.3 + Math.sin(time * 6) * 0.3;
            pressureCore.rotation.y += deltaTime * 2;
            pressureCore.rotation.x = Math.sin(time * 3) * 0.2;

            // Steam particles - rising frustration
            steamParticles.forEach(steam => {
                if (!steam.visible && Math.random() < 0.1) {
                    steam.visible = true;
                    steam.position.set(
                        (Math.random() - 0.5) * 0.8,
                        2.3,
                        (Math.random() - 0.5) * 0.8
                    );
                    steam.material.opacity = 0.5;
                }

                if (steam.visible) {
                    steam.position.y += steam.userData.speed * deltaTime;
                    steam.position.x += steam.userData.drift * deltaTime;
                    steam.material.opacity -= deltaTime * 0.3;

                    if (steam.position.y > 5 || steam.material.opacity <= 0) {
                        steam.visible = false;
                    }
                }
            });

            // Light flickers with anger
            simmerLight.intensity = 1.5 + Math.sin(time * 8) * 0.3;
        }

        // Animate hearth world - cozy, warm, gentle breathing
        function animateHearthWorld(time) {
            if (currentWorld !== 'hearth') return;

            // Glowing orbs - gentle pulse like candlelight
            glowOrbs.forEach(orb => {
                const o = orb.userData;
                const pulse = Math.sin(time * o.pulseSpeed + o.pulsePhase) * 0.15 + 0.85;
                orb.material.opacity = o.baseOpacity * pulse;
                orb.scale.setScalar(1 + (pulse - 0.85) * 0.3);
            });

            // Family cluster - gentle breathing together
            const breathe = Math.sin(time * 0.8) * 0.02;
            familyGroup.position.y = breathe;
            familyGroup.rotation.y = Math.sin(time * 0.2) * 0.03;

            // Kids snuggle closer occasionally
            kid1.position.z = 0.4 + Math.sin(time * 0.5) * 0.03;
            kid2.position.x = -0.25 + Math.sin(time * 0.4) * 0.02;

            // Motes - very slow, peaceful drift
            hearthMotes.forEach(mote => {
                const m = mote.userData;
                mote.position.y = m.baseY + Math.sin(time * m.floatSpeed + m.floatPhase) * 0.2;
