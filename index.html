<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Nintendo Style Panda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; }
        canvas { display: block; min-width: 390px; min-height: 664px; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            max-height: calc(100dvh - 60px);
            overflow-y: auto;
            padding-right: 6px;
            padding-bottom: 40px;
        }
        #controls select {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #controls select:hover {
            background: white;
        }
        #controls label {
            display: block;
            margin-bottom: 6px;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #toggleControls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            padding: 6px 12px;
            font-size: 12px;
            font-family: 'Segoe UI', Arial, sans-serif;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #toggleControls:hover { background: white; }
        #fullscreenBtn:hover { background: white; }
        #controls.hidden { display: none; }
        #controls.visible { top: 44px; }
    </style>
</head>
<body>
    <div id="info">🐼 Nintendo Style Panda<br><small>Drag to rotate • Scroll to zoom</small></div>
    <button id="toggleControls" onclick="document.getElementById('controls').classList.toggle('hidden'); this.textContent = document.getElementById('controls').classList.contains('hidden') ? 'Show Controls' : 'Hide Controls';">Show Controls</button>
    <div id="controls" class="visible hidden">
        <button id="fullscreenBtn" style="display:none; width:100%; margin-bottom:8px; padding:8px 16px; font-size:14px; border:none; border-radius:8px; background:rgba(255,255,255,0.9); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2);" onclick="if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}else{document.exitFullscreen()}">Fullscreen</button>
        <script>if(document.documentElement.requestFullscreen)document.getElementById('fullscreenBtn').style.display='';</script>
        <label>
            <input type="checkbox" id="lockCameraToggle" checked style="margin-right: 6px;">
            Lock Camera
        </label>
        <label style="margin-top: 6px;">World</label>
        <select id="worldSelect">
            <option value="bamboo">Calm Bamboo</option>
            <option value="lava">Lava</option>
            <option value="drift">Amber Drift</option>
            <option value="voltage">Voltage</option>
            <option value="hearth">Hearth</option>
            <option value="simmer">Simmer</option>
            <option value="glade">Forest Glade</option>
            <option value="abyss">The Abyss</option>
            <option value="melancholy">Melancholy</option>
            <option value="euphoria">Euphoria</option>
            <option value="tension">Tension</option>

        </select>
        <label style="margin-top: 12px;">Scale</label>
        <select id="scaleSelect">
            <option value="standard">Standard</option>
            <option value="grand">Grand</option>
        </select>
        <label style="margin-top: 12px;">Character</label>
        <select id="characterSelect">
            <option value="panda">Panda</option>
            <option value="sphere" selected>Sphere</option>
        </select>
        <label style="margin-top: 12px;">Reflection Mode</label>
        <select id="reflectionMode">
            <option value="realtime">Crisp (CubeCamera)</option>
            <option value="gradient">Soft (Gradient)</option>
            <option value="ssr">Screen Space (SSR)</option>

        <label style="margin-top: 12px;">Mirror Parts</label>
        <select id="mirrorParts">
            <option value="body">Body Only</option>
            <option value="all">All Parts</option>

        <label style="margin-top: 12px;">
            <input type="checkbox" id="morphToggle" style="margin-right: 6px;">
            Morph Mode
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="addMaterialToggle" style="margin-right: 6px;">
            Add Material Mode
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="birdsToggle" style="margin-right: 6px;">

            <option value="none">None</option>

        </select>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="floatModeToggle" style="margin-right: 6px;">
            Tap to Float
        </label>
        <label style="margin-top: 12px;">
            <input type="checkbox" id="birdCollisionToggle" style="margin-right: 6px;">

        </label>

            <option value="normal">Normal</option>

        </select>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- Tone.js for interaction sounds -->
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { SSRPass } from 'three/addons/postprocessing/SSRPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        // Generate gradient environment for soft reflections
        function createGradientEnvironment() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 0, 1024);
            gradient.addColorStop(0, '#1e90ff');
            gradient.addColorStop(0.35, '#87ceeb');
            gradient.addColorStop(0.5, '#ffffff');
            gradient.addColorStop(0.65, '#90ee90');
            gradient.addColorStop(1, '#228b22');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1024, 1024);

            // Add clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 350;
                const r = 30 + Math.random() * 60;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }

        const gradientEnvMap = createGradientEnvironment();

        // Reflection mode state
        let reflectionMode = 'realtime'; // 'realtime', 'gradient', 'ssr'

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0;
        controls.maxDistance = 30;
        controls.target.set(0, 1.8, 0);

        // Lighting - attached to camera so it follows the view
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // Add camera to scene so its child lights are rendered
        scene.add(camera);

        // Key light - front right, attached to camera
        const keyLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        keyLight.position.set(3, 5, 2);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -10;
        keyLight.shadow.camera.right = 10;
        keyLight.shadow.camera.top = 10;
        keyLight.shadow.camera.bottom = -10;
        camera.add(keyLight);

        // Fill light - left side, attached to camera
        const fillLight = new THREE.DirectionalLight(0x8ec8ff, 0.6);
        fillLight.position.set(-4, 3, 1);
        camera.add(fillLight);

        // Rim light - behind, attached to camera
        const rimLight = new THREE.DirectionalLight(0xffddaa, 0.8);
        rimLight.position.set(0, 2, -5);
        camera.add(rimLight);

        // ============================================
        // CUSTOM MESH CREATION UTILITIES
        // ============================================

        // Smooth a geometry by merging vertices and recomputing normals
        function smoothGeometry(geometry) {
            geometry = mergeVertices(geometry);
            geometry.computeVertexNormals();
            return geometry;
        }

        // Create a smooth mesh from control points using Catmull-Rom subdivision
        function createSmoothMesh(profile, segments, radialSegments, material) {
            const points = [];

            // Catmull-Rom interpolation for smooth curves
            for (let i = 0; i < profile.length - 1; i++) {
                const p0 = profile[Math.max(0, i - 1)];
                const p1 = profile[i];
                const p2 = profile[Math.min(profile.length - 1, i + 1)];
                const p3 = profile[Math.min(profile.length - 1, i + 2)];

                for (let t = 0; t < segments; t++) {
                    const s = t / segments;
                    const tt = s * s;
                    const ttt = tt * s;

                    const q0 = -ttt + 2*tt - s;
                    const q1 = 3*ttt - 5*tt + 2;
                    const q2 = -3*ttt + 4*tt + s;
                    const q3 = ttt - tt;

                    points.push(new THREE.Vector2(
                        0.5 * (p0.x*q0 + p1.x*q1 + p2.x*q2 + p3.x*q3),
                        0.5 * (p0.y*q0 + p1.y*q1 + p2.y*q2 + p3.y*q3)
                    ));
                }
            }
            points.push(profile[profile.length - 1]);

            const geometry = new THREE.LatheGeometry(points, radialSegments);
            return new THREE.Mesh(geometry, material);
        }

        // Create mesh from vertices and indices
        function createCustomMesh(vertices, indices, material, computeNormals = true) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            if (computeNormals) {
                geometry.computeVertexNormals();
            }
            return new THREE.Mesh(geometry, material);
        }

        // Subdivide and smooth a mesh
        function subdivideMesh(geometry, iterations = 1) {
            for (let iter = 0; iter < iterations; iter++) {
                const positions = geometry.attributes.position.array;
                const indices = geometry.index ? Array.from(geometry.index.array) : null;

                if (!indices) continue;

                const newPositions = [...positions];
                const newIndices = [];
                const edgeMidpoints = new Map();

                function getEdgeKey(i1, i2) {
                    return i1 < i2 ? `${i1}_${i2}` : `${i2}_${i1}`;
                }

                function getMidpoint(i1, i2) {
                    const key = getEdgeKey(i1, i2);
                    if (edgeMidpoints.has(key)) {
                        return edgeMidpoints.get(key);
                    }

                    const newIndex = newPositions.length / 3;
                    newPositions.push(
                        (positions[i1*3] + positions[i2*3]) / 2,
                        (positions[i1*3+1] + positions[i2*3+1]) / 2,
                        (positions[i1*3+2] + positions[i2*3+2]) / 2
                    );
                    edgeMidpoints.set(key, newIndex);
                    return newIndex;
                }

                for (let i = 0; i < indices.length; i += 3) {
                    const a = indices[i];
                    const b = indices[i+1];
                    const c = indices[i+2];

                    const ab = getMidpoint(a, b);
                    const bc = getMidpoint(b, c);
                    const ca = getMidpoint(c, a);

                    newIndices.push(a, ab, ca);
                    newIndices.push(b, bc, ab);
                    newIndices.push(c, ca, bc);
                    newIndices.push(ab, bc, ca);
                }

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(newPositions, 3));
                geometry.setIndex(newIndices);
            }

            geometry.computeVertexNormals();
            return geometry;
        }

        // ============================================
        // PANDA MESH CREATION
        // ============================================

        // Materials
        const whiteFurMaterial = new THREE.MeshStandardMaterial({
            color: 0xf5f5f5,
            roughness: 0.7,
            metalness: 0.0,
        });

        // CubeCamera for real-time reflections
        const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512, {
            format: THREE.RGBAFormat,
            generateMipmaps: true,
            minFilter: THREE.LinearMipmapLinearFilter,
        });
        const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget);
        cubeCamera.position.set(0, 1.5, 0);
        scene.add(cubeCamera);

        // Mirror material for body - uses CubeCamera for crisp reflections
        const mirrorMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.0,
            metalness: 1.0,
            envMap: cubeRenderTarget.texture,
            envMapIntensity: 1.5,
        });

        const blackFurMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.8,
            metalness: 0.0,
        });

        const noseMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111,
            roughness: 0.3,
            metalness: 0.1,
        });

        const eyeMaterial = new THREE.MeshStandardMaterial({
            color: 0x000000,
            roughness: 0.0,
            metalness: 0.3,
        });

        const eyeHighlightMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
        });

        const cheekMaterial = new THREE.MeshStandardMaterial({
            color: 0xffb6c1,
            roughness: 0.9,
            metalness: 0.0,
            transparent: true,
            opacity: 0.6,
        });

        // ============================================
        // ENERGY AURA SHADER
        // ============================================
        const auraShader = {
            uniforms: {
                time: { value: 0 },
                color1: { value: new THREE.Color(0x00ffff) },
                color2: { value: new THREE.Color(0xff00ff) },
                pulseSpeed: { value: 2.0 },
                noiseScale: { value: 3.0 },
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying float vDisplacement;
                uniform float time;
                uniform float noiseScale;

                // Simplex noise function
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy));
                    vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min(g.xyz, l.zxy);
                    vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute(permute(permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857;
                    vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_);
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4(x.xy, y.xy);
                    vec4 b1 = vec4(x.zw, y.zw);
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                    vec3 p0 = vec3(a0.xy, h.x);
                    vec3 p1 = vec3(a0.zw, h.y);
                    vec3 p2 = vec3(a1.xy, h.z);
                    vec3 p3 = vec3(a1.zw, h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                    p0 *= norm.x;
                    p1 *= norm.y;
                    p2 *= norm.z;
                    p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                }

                void main() {
                    vNormal = normalize(normalMatrix * normal);

                    // Animated noise displacement
                    float noise = snoise(position * noiseScale + time * 0.5);
                    float pulse = sin(time * 2.0) * 0.5 + 0.5;
                    vDisplacement = noise * 0.15 + pulse * 0.1;

                    // Push vertices outward along normal with noise
                    vec3 newPosition = position + normal * (0.15 + vDisplacement * 0.2);

                    vWorldPosition = (modelMatrix * vec4(newPosition, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;
                varying float vDisplacement;
                uniform float time;
                uniform vec3 color1;
                uniform vec3 color2;
                uniform float pulseSpeed;

                void main() {
                    // Fresnel for edge glow
                    vec3 viewDir = normalize(cameraPosition - vWorldPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 2.5);

                    // Pulsing color mix
                    float colorPulse = sin(time * pulseSpeed + vWorldPosition.y * 2.0) * 0.5 + 0.5;
                    vec3 auraColor = mix(color1, color2, colorPulse);

                    // Add energy flickers
                    float flicker = sin(time * 20.0 + vWorldPosition.y * 10.0) * 0.1 + 0.9;

                    // Combine
                    vec3 finalColor = auraColor * (fresnel * 2.0 + 0.3) * flicker;
                    finalColor += pow(fresnel, 4.0) * vec3(1.0); // Bright edge highlight

                    // Alpha - visible at edges, transparent in middle
                    float alpha = fresnel * 0.8 * flicker;
                    alpha += vDisplacement * 0.3;
                    alpha = clamp(alpha, 0.0, 0.9);

                    gl_FragColor = vec4(finalColor, alpha);
                }
            `
        };

        const auraMaterial = new THREE.ShaderMaterial({
            uniforms: auraShader.uniforms,
            vertexShader: auraShader.vertexShader,
            fragmentShader: auraShader.fragmentShader,
            transparent: true,
            side: THREE.BackSide, // Render inside-out so it surrounds the object
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        let auraEnabled = false;
        const auraMeshes = []; // Store aura meshes

        // ============================================
        // CAMERA CREATURE
        // ============================================
        const cameraCreature = new THREE.Group();

        // Creature body - ghostly blob shape
        const creatureBodyProfile = [
            new THREE.Vector2(0, 0),
            new THREE.Vector2(0.15, 0.05),
            new THREE.Vector2(0.25, 0.15),
            new THREE.Vector2(0.3, 0.3),
            new THREE.Vector2(0.32, 0.5),
            new THREE.Vector2(0.3, 0.7),
            new THREE.Vector2(0.25, 0.85),
            new THREE.Vector2(0.15, 0.95),
            new THREE.Vector2(0, 1.0),
        ];

        const creatureMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ddff,
            roughness: 0.3,
            metalness: 0.1,
            transparent: true,
            opacity: 0.85,
        });

        const creatureBody = createSmoothMesh(creatureBodyProfile, 6, 16, creatureMaterial);
        creatureBody.scale.set(1, 1.2, 0.8);
        cameraCreature.add(creatureBody);

        // Big cute eyes
        const creatureEyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const creatureEyePupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        function createCreatureEye(xPos) {
            const eyeGroup = new THREE.Group();

            let eyeWhiteGeo = new THREE.IcosahedronGeometry(0.1, 2);
            eyeWhiteGeo = smoothGeometry(eyeWhiteGeo);
            const eyeWhite = new THREE.Mesh(eyeWhiteGeo, creatureEyeWhiteMat);
            eyeWhite.scale.set(1, 1.2, 0.6);
            eyeGroup.add(eyeWhite);

            let pupilGeo = new THREE.IcosahedronGeometry(0.05, 2);
            pupilGeo = smoothGeometry(pupilGeo);
            const pupil = new THREE.Mesh(pupilGeo, creatureEyePupilMat);
            pupil.position.z = 0.05;
            eyeGroup.add(pupil);

            eyeGroup.position.set(xPos, 0.7, 0.2);
            return eyeGroup;
        }

        cameraCreature.add(createCreatureEye(-0.12));
        cameraCreature.add(createCreatureEye(0.12));

        // Little arms/tentacles
        const armMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ddff,
            roughness: 0.3,
            metalness: 0.1,
        });

        function createCreatureArm(xPos, zRot) {
            let armGeo = new THREE.CapsuleGeometry(0.04, 0.2, 4, 8);

            // Remove current character from scene

            // Reset morph state

            document.getElementById('morphToggle').checked = false;

            if (characterType === 'panda') {
                currentCharacter = pandaCharacter;
            } else if (characterType === 'sphere') {
                // Create sphere if not exists
                if (!sphereCharacter) {
                    sphereCharacter = createSphereCharacter();
                }
                currentCharacter = sphereCharacter;
            }

            // Add new character to scene
            scene.add(currentCharacter.group);

            // Update clickable meshes

            // Update morphable parts
            updateMorphableParts();

            // Update SSR selects

            ssrSelects.push(currentCharacter.body);

            // Reset mirror parts dropdown
            document.getElementById('mirrorParts').value = 'body';
            applyMirrorSetting('body');

                } else if (mesh) {
                    storeMorphData(mesh);

            const allMirror = (mode === 'all');
            Object.entries(currentCharacter.parts).forEach(([name, mesh]) => {
                if (!mesh) return;
                if (name === 'body') return; // Body always mirror

                // Determine original material based on part name

                if (name.includes('Ear') || name.includes('Arm') || name.includes('Paw') ||

            for (let i = 0; i <= segments; i++) {

                const r = 0.06 + Math.sin(i * Math.PI / segments) * 0.01;
                stalkProfile.push(new THREE.Vector2(r, y));

                if (i < segments) {

            return bambooGroup;

                color: 0x2d5a27,

            for (let i = 0; i < 5; i++) {
                const leafCluster = new THREE.Mesh(

        function createMushroom(x, z, size) {
            const mushroomGroup = new THREE.Group();

            const stem = new THREE.Mesh(
                new THREE.CylinderGeometry(size * 0.15, size * 0.2, size * 0.4, 8),
                new THREE.MeshStandardMaterial({ color: 0xf5f5dc })
            );
            stem.position.y = size * 0.2;

            const cap = new THREE.Mesh(
                new THREE.SphereGeometry(size * 0.4, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: 0xcc3333 })
            );
            cap.position.y = size * 0.4;
            mushroomGroup.add(cap);

            // Spots

                const spot = new THREE.Mesh(
                    new THREE.CircleGeometry(size * 0.06, 8),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                const theta = Math.random() * Math.PI * 0.4;
                const phi = Math.random() * Math.PI * 2;
                spot.position.set(
                    Math.sin(theta) * Math.cos(phi) * size * 0.38,
                    size * 0.4 + Math.cos(theta) * size * 0.38,
                    Math.sin(theta) * Math.sin(phi) * size * 0.38
                );
                spot.lookAt(mushroomGroup.position.x, size * 0.4, mushroomGroup.position.z);
                mushroomGroup.add(spot);
            }

            mushroomGroup.position.set(x, 0, z);
            return mushroomGroup;

        // Shell grass shader material for super detail
        const shellGrassUniforms = { time: { value: 0 } };
        function createShellGrassMaterial(shellIndex, shellCount, baseColor, tipColor) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    time: shellGrassUniforms.time,
                    shellIndex: { value: shellIndex },
                    shellCount: { value: shellCount },
                    baseColor: { value: new THREE.Color(baseColor) },
                    tipColor: { value: new THREE.Color(tipColor) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying float vHeight;
                    uniform float shellIndex;
                    uniform float shellCount;
                    uniform float time;

                    void main() {
                        vUv = uv;
                        vHeight = shellIndex / shellCount;

                        vec3 pos = position;
                        pos.y += shellIndex * 0.025;

                        // Wind sway increases with height
                        float sway = sin(time * 1.5 + position.x * 3.0 + position.z * 2.0) * 0.04 * vHeight;
                        pos.x += sway;
                        pos.z += sway * 0.5;

                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    varying float vHeight;
                    uniform vec3 baseColor;
                    uniform vec3 tipColor;

                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                    }

                    void main() {
                        // Dense grass pattern
                        vec2 uv = vUv * 80.0;
                        vec2 cell = floor(uv);
                        vec2 local = fract(uv);

                        // Each cell has random grass blade
                        float h = hash(cell);
                        float h2 = hash(cell + 50.0);

                        // Blade presence decreases with height (grass tips are sparse)
                        float threshold = h * 0.9 + 0.1;
                        if (vHeight > threshold) discard;

                        // Blade shape - thin vertical strip
                        float bladeX = h2 * 0.6 + 0.2;
                        float bladeWidth = 0.15 + h * 0.1;
                        float inBlade = 1.0 - smoothstep(0.0, bladeWidth, abs(local.x - bladeX));

                        if (inBlade < 0.3) discard;

                        vec3 color = mix(baseColor, tipColor, vHeight);
                        // Darken based on blade position for depth
                        color *= 0.7 + inBlade * 0.3;

                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.DoubleSide,
                transparent: true
            });
        }

                        gl_FragColor = vec4(1.0, 0.3 * pulse, 0.0, crack * pulse);
                    }
                `,
                transparent: true, side: THREE.DoubleSide
            });

        // ============================================

        const textureUniforms = { time: { value: 0 } };

        // Generate procedural textures
        function generateBambooTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Base bamboo green
            ctx.fillStyle = '#4a7c23';
            ctx.fillRect(0, 0, 256, 256);

            // Vertical grain lines
            for (let i = 0; i < 50; i++) {
                ctx.strokeStyle = `rgba(${60 + Math.random() * 30}, ${100 + Math.random() * 40}, ${30 + Math.random() * 20}, 0.3)`;
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                ctx.moveTo(Math.random() * 256, 0);
                ctx.lineTo(Math.random() * 256, 256);
                ctx.stroke();
            }

            // Node rings
            for (let y = 40; y < 256; y += 60) {
                ctx.strokeStyle = '#3a6618';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, y + Math.random() * 10);
                ctx.lineTo(256, y + Math.random() * 10);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateGrassGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#3d5a28';
            ctx.fillRect(0, 0, 512, 512);

            // Dense grass blades
            for (let i = 0; i < 4000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const h = 8 + Math.random() * 20;
                const lean = (Math.random() - 0.5) * 15;

                const grad = ctx.createLinearGradient(x, y, x + lean, y - h);
                grad.addColorStop(0, '#3a5a23');
                grad.addColorStop(1, '#7ab534');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.quadraticCurveTo(x + lean * 0.5, y - h * 0.6, x + lean, y - h);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateRockTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(256, 256);

            for (let i = 0; i < 256 * 256; i++) {
                const v = 40 + Math.random() * 60;
                imageData.data[i * 4] = v;
                imageData.data[i * 4 + 1] = v * 0.9;
                imageData.data[i * 4 + 2] = v * 0.85;
                imageData.data[i * 4 + 3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);

            // Cracks
            ctx.strokeStyle = 'rgba(30, 25, 20, 0.5)';
            for (let i = 0; i < 15; i++) {
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                let x = Math.random() * 256, y = Math.random() * 256;
                ctx.moveTo(x, y);
                for (let j = 0; j < 5; j++) {
                    x += (Math.random() - 0.5) * 40;
                    y += (Math.random() - 0.5) * 40;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateLavaRockTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1a0a08';
            ctx.fillRect(0, 0, 256, 256);

            // Volcanic texture
            for (let i = 0; i < 2000; i++) {
                const v = Math.random();
                ctx.fillStyle = v > 0.95 ? '#ff4400' : `rgba(${30 + Math.random() * 20}, ${10 + Math.random() * 15}, ${5 + Math.random() * 10}, 0.5)`;
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 3, 2 + Math.random() * 3);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateSphereTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Gradient base
            const grad = ctx.createLinearGradient(0, 0, 512, 256);
            grad.addColorStop(0, '#4488cc');
            grad.addColorStop(0.5, '#66aaee');
            grad.addColorStop(1, '#4488cc');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 256);

            // Swirl pattern
            for (let i = 0; i < 20; i++) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + Math.random() * 0.2})`;
                ctx.lineWidth = 2 + Math.random() * 5;
                ctx.beginPath();
                let x = Math.random() * 512;
                let y = Math.random() * 256;
                ctx.moveTo(x, y);
                for (let j = 0; j < 10; j++) {
                    x += Math.cos(j * 0.5) * 20;
                    y += Math.sin(j * 0.5) * 10;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Sparkles
            for (let i = 0; i < 100; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.random() * 0.7})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, 1 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#8B5A2B';
            ctx.fillRect(0, 0, 256, 256);

            // Wood grain
            for (let i = 0; i < 80; i++) {
                ctx.strokeStyle = `rgba(${100 + Math.random() * 50}, ${60 + Math.random() * 30}, ${20 + Math.random() * 20}, 0.3)`;
                ctx.lineWidth = 1 + Math.random() * 3;
                const y = Math.random() * 256;
                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x < 256; x += 20) {
                    ctx.lineTo(x, y + Math.sin(x * 0.05) * 5);
                }
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateLeafTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#5a9c2e';
            ctx.fillRect(0, 0, 128, 128);

            // Vein pattern
            ctx.strokeStyle = '#4a8c1e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(64, 128);
            ctx.lineTo(64, 0);
            ctx.stroke();

            for (let y = 20; y < 128; y += 20) {
                ctx.beginPath();
                ctx.moveTo(64, y);
                ctx.lineTo(20 + Math.random() * 20, y - 10);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(64, y);
                ctx.lineTo(88 + Math.random() * 20, y - 10);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // Additional texture generators for all worlds
        function generateMetalTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 256, 256);
            grad.addColorStop(0, '#666677');
            grad.addColorStop(0.5, '#888899');
            grad.addColorStop(1, '#666677');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // Scratches
            for (let i = 0; i < 30; i++) {
                ctx.strokeStyle = `rgba(200, 200, 210, ${0.1 + Math.random() * 0.2})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(Math.random() * 256, Math.random() * 256);
                ctx.lineTo(Math.random() * 256, Math.random() * 256);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateConcreteTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#444450';
            ctx.fillRect(0, 0, 256, 256);

            for (let i = 0; i < 3000; i++) {
                const v = 50 + Math.random() * 40;
                ctx.fillStyle = `rgb(${v}, ${v}, ${v + 10})`;
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateFabricTexture(baseColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            const c = new THREE.Color(baseColor);
            ctx.fillStyle = `rgb(${c.r*255|0}, ${c.g*255|0}, ${c.b*255|0})`;
            ctx.fillRect(0, 0, 128, 128);

            // Weave pattern
            for (let x = 0; x < 128; x += 4) {
                for (let y = 0; y < 128; y += 4) {
                    const light = ((x + y) / 4) % 2 === 0;
                    ctx.fillStyle = light ?
                        `rgba(255, 255, 255, 0.1)` :
                        `rgba(0, 0, 0, 0.1)`;
                    ctx.fillRect(x, y, 4, 4);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateRugTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Warm rug base
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 0, 256, 256);

            // Pattern rings
            for (let r = 120; r > 20; r -= 20) {
                ctx.strokeStyle = r % 40 === 0 ? '#CD853F' : '#A0522D';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(128, 128, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Fringe texture
            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = `rgba(${139 + Math.random()*40|0}, ${69 + Math.random()*30|0}, ${19 + Math.random()*20|0}, 0.3)`;
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateLavaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Hot lava gradient
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 150);
            grad.addColorStop(0, '#ffaa00');
            grad.addColorStop(0.3, '#ff6600');
            grad.addColorStop(0.7, '#cc3300');
            grad.addColorStop(1, '#661100');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // Bubbles/texture
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const r = 5 + Math.random() * 15;
                const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad2.addColorStop(0, 'rgba(255, 200, 50, 0.8)');
                grad2.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateWaterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 256, 256);
            grad.addColorStop(0, '#3498db');
            grad.addColorStop(0.5, '#5dade2');
            grad.addColorStop(1, '#3498db');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // Ripples
            for (let i = 0; i < 20; i++) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + Math.random() * 0.2})`;
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                ctx.arc(Math.random() * 256, Math.random() * 256, 10 + Math.random() * 30, 0, Math.PI * 2);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateFlowerTexture(petalColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#3d6b35';
            ctx.fillRect(0, 0, 64, 64);

            // Petals
            const c = new THREE.Color(petalColor);
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                ctx.fillStyle = `rgb(${c.r*255|0}, ${c.g*255|0}, ${c.b*255|0})`;
                ctx.beginPath();
                ctx.ellipse(32 + Math.cos(angle) * 15, 32 + Math.sin(angle) * 15, 10, 6, angle, 0, Math.PI * 2);
                ctx.fill();
            }

            // Center
            ctx.fillStyle = '#ffdd00';
            ctx.beginPath();
            ctx.arc(32, 32, 6, 0, Math.PI * 2);
            ctx.fill();

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateBarkTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#654321';
            ctx.fillRect(0, 0, 128, 256);

            // Vertical bark lines
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * 128;
                ctx.strokeStyle = `rgba(${40 + Math.random()*30|0}, ${25 + Math.random()*20|0}, ${10 + Math.random()*15|0}, 0.7)`;
                ctx.lineWidth = 2 + Math.random() * 4;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                for (let y = 0; y < 256; y += 20) {
                    ctx.lineTo(x + (Math.random() - 0.5) * 10, y);
                }
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateMushroomTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#cc4444';
            ctx.fillRect(0, 0, 64, 64);

            // White spots
            for (let i = 0; i < 8; i++) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(Math.random() * 64, Math.random() * 64, 3 + Math.random() * 5, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function generateElectricTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, 128, 128);

            // Electric arcs
            for (let i = 0; i < 5; i++) {
                ctx.strokeStyle = `rgba(100, 150, 255, ${0.5 + Math.random() * 0.5})`;
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                let x = Math.random() * 128;
                let y = 0;
                ctx.moveTo(x, y);
                while (y < 128) {
                    x += (Math.random() - 0.5) * 20;
                    y += 5 + Math.random() * 10;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // Pre-generate textures
        const sceneTextures = {
            bamboo: generateBambooTexture(),
            grassGround: generateGrassGroundTexture(),
            rock: generateRockTexture(),
            lavaRock: generateLavaRockTexture(),
            sphere: generateSphereTexture(),
            wood: generateWoodTexture(),
            leaf: generateLeafTexture(),
            metal: generateMetalTexture(),
            concrete: generateConcreteTexture(),
            fabricWarm: generateFabricTexture(0xeeddcc),
            fabricCool: generateFabricTexture(0xccddee),
            rug: generateRugTexture(),
            lava: generateLavaTexture(),
            water: generateWaterTexture(),
            flowerPink: generateFlowerTexture(0xff6b8a),
            flowerYellow: generateFlowerTexture(0xffeb3b),
            bark: generateBarkTexture(),
            mushroom: generateMushroomTexture(),
            electric: generateElectricTexture()
        };

        // Store original materials for swapping
        const originalMaterials = new Map();

        // Helper to apply texture to a mesh
        function applyTextureToMesh(child, texture, options = {}) {
            if (!originalMaterials.has(child)) {
                originalMaterials.set(child, child.material);
            }
            child.material = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: options.roughness ?? 0.8,
                metalness: options.metalness ?? 0,
                emissive: options.emissive ?? 0x000000,
                emissiveIntensity: options.emissiveIntensity ?? 0,
                side: options.doubleSide ? THREE.DoubleSide : THREE.FrontSide
            });
        }

        // Apply textures to existing meshes
        function applyTexturesToScene() {
            // BAMBOO WORLD
            bambooWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                if (hex === 0x4a7c23) applyTextureToMesh(child, sceneTextures.bamboo, { roughness: 0.6 });
                else if (hex === 0x5a9c2e) applyTextureToMesh(child, sceneTextures.leaf, { roughness: 0.8, doubleSide: true });
                else if (hex === 0x7ec850) applyTextureToMesh(child, sceneTextures.grassGround, { roughness: 0.9 });
            });

            // LAVA WORLD
            lavaWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                // Dark rocks
                if (hex === 0x1a0a0a || hex === 0x2a1a1a || hex === 0x3a2a2a) {
                    applyTextureToMesh(child, sceneTextures.lavaRock, { roughness: 0.9, emissive: 0x220500, emissiveIntensity: 0.2 });
                }
                // Lava pools (orange/red emissive)
                else if (child.material.emissive && child.material.emissiveIntensity > 0) {
                    applyTextureToMesh(child, sceneTextures.lava, { roughness: 0.3, emissive: 0xff4400, emissiveIntensity: 0.8 });
                }
                // Ground
                else if (hex === 0x1a0505 || hex === 0x0a0505) {
                    applyTextureToMesh(child, sceneTextures.lavaRock, { roughness: 0.95 });
                }
            });

            // DRIFT WORLD
            driftWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                // Wooden floor - 0x8b7355
                if (hex === 0x8b7355) {
                    applyTextureToMesh(child, sceneTextures.wood, { roughness: 0.85 });
                }
                // Floating stones - check warm brown/tan range (HSL modified from 0xa09080)
                else if (color.r > 0.4 && color.r < 0.8 && color.g > 0.3 && color.g < 0.7 && color.b > 0.2 && color.b < 0.6) {
                    applyTextureToMesh(child, sceneTextures.rock, { roughness: 0.9 });
                }
                // Paper/thought forms - 0xc4a882
                else if (hex === 0xc4a882) {
                    applyTextureToMesh(child, sceneTextures.fabricWarm, { roughness: 0.95, doubleSide: true });
                }
            });

            // VOLTAGE WORLD
            voltageWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                // Concrete floor - 0x3a3a3a
                if (hex === 0x3a3a3a) {
                    applyTextureToMesh(child, sceneTextures.concrete, { roughness: 0.9 });
                }
                // Metal spinners - 0x666666, or HSL modified (cyan/gray tones)
                else if (hex === 0x666666 || (color.r > 0.2 && color.r < 0.6 && Math.abs(color.r - color.g) < 0.15 && Math.abs(color.g - color.b) < 0.15)) {
                    applyTextureToMesh(child, sceneTextures.metal, { roughness: 0.3, metalness: 0.8 });
                }
                // Screens - 0x00ff88 (green glow)
                else if (hex === 0x00ff88 || (color.g > 0.8 && color.r < 0.3)) {
                    applyTextureToMesh(child, sceneTextures.electric, { roughness: 0.2, emissive: 0x00ff88, emissiveIntensity: 0.5 });
                }
                // Light fixture - 0xffffee
                else if (hex === 0xffffee) {
                    applyTextureToMesh(child, sceneTextures.electric, { roughness: 0.1, emissive: 0xffffee, emissiveIntensity: 0.8 });
                }
            });

            // HEARTH WORLD
            hearthWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                // Rug - 0x8b6b4a
                if (hex === 0x8b6b4a) {
                    applyTextureToMesh(child, sceneTextures.rug, { roughness: 0.95 });
                }
                // Family shapes - 0xddccbb, 0xeeddcc, 0xffeeee, 0xeeffee
                else if (hex === 0xddccbb || hex === 0xeeddcc || hex === 0xffeeee || hex === 0xeeffee) {
                    applyTextureToMesh(child, sceneTextures.fabricWarm, { roughness: 0.9 });
                }
                // Cushions - 0xcc9977 or HSL warm tones
                else if (hex === 0xcc9977 || (color.r > 0.4 && color.r < 0.8 && color.g > 0.3 && color.g < 0.6 && color.b > 0.2 && color.b < 0.5)) {
                    applyTextureToMesh(child, sceneTextures.fabricWarm, { roughness: 0.9 });
                }
                // Blankets - 0x997766 or HSL brownish tones
                else if (hex === 0x997766 || (color.r > 0.35 && color.r < 0.55 && color.g > 0.25 && color.g < 0.45)) {
                    applyTextureToMesh(child, sceneTextures.fabricCool, { roughness: 0.9, doubleSide: true });
                }
            });

            // SIMMER WORLD
            simmerWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                // Floor - 0x553333
                if (hex === 0x553333) {
                    applyTextureToMesh(child, sceneTextures.lavaRock, { roughness: 0.9, emissive: 0x331111, emissiveIntensity: 0.1 });
                }
                // Scattered toys - 0xdd6644 or HSL bright warm colors
                else if (hex === 0xdd6644 || (color.r > 0.6 && color.g < 0.5 && color.b < 0.4)) {
                    applyTextureToMesh(child, sceneTextures.fabricWarm, { roughness: 0.5 });
                }
                // Containers - 0x885544
                else if (hex === 0x885544) {
                    applyTextureToMesh(child, sceneTextures.wood, { roughness: 0.7 });
                }
                // Pressure core - 0xff3300 (emissive)
                else if (hex === 0xff3300) {
                    applyTextureToMesh(child, sceneTextures.lava, { roughness: 0.3, emissive: 0xff3300, emissiveIntensity: 0.8 });
                }
            });

            // GLADE WORLD
            gladeWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                // Tree trunks - 0x5c4033
                if (hex === 0x5c4033) {
                    applyTextureToMesh(child, sceneTextures.bark, { roughness: 0.95 });
                }
                // Tree canopy/leaves - 0x2d5a27 or HSL greens
                else if (hex === 0x2d5a27 || (color.g > color.r && color.g > color.b && color.r < 0.3 && color.g > 0.2 && color.g < 0.5)) {
                    applyTextureToMesh(child, sceneTextures.leaf, { roughness: 0.8, doubleSide: true });
                }
                // Grass ground - 0x3d8c40
                else if (hex === 0x3d8c40) {
                    applyTextureToMesh(child, sceneTextures.grassGround, { roughness: 0.9 });
                }
                // Grass blades - 0x4a9f4d, 0x3a7d32, or HSL greens (brighter grass tones)
                else if (hex === 0x4a9f4d || hex === 0x3a7d32 || (color.g > color.r * 1.3 && color.g > color.b * 1.2 && color.g > 0.35 && color.g < 0.65)) {
                    applyTextureToMesh(child, sceneTextures.leaf, { roughness: 0.7, doubleSide: true });
                }
                // Flowers - pink/white/purple/blue
                else if (hex === 0xff6b8a || hex === 0x9b59b6 || hex === 0x3498db || hex === 0xffffff) {
                    applyTextureToMesh(child, sceneTextures.flowerPink, { roughness: 0.7 });
                }
                // Flowers - yellow/orange and flower center
                else if (hex === 0xffeb3b || hex === 0xff9800 || hex === 0xffdd00) {
                    applyTextureToMesh(child, sceneTextures.flowerYellow, { roughness: 0.7 });
                }
                // Mushroom caps - 0xcc3333
                else if (hex === 0xcc3333) {
                    applyTextureToMesh(child, sceneTextures.mushroom, { roughness: 0.7 });
                }
                // Mushroom stem - 0xf5f5dc (beige)
                else if (hex === 0xf5f5dc) {
                    applyTextureToMesh(child, sceneTextures.fabricWarm, { roughness: 0.8 });
                }
            });

            // GRAND WORLD
            grandWorld.traverse(child => {
                if (!child.isMesh || originalMaterials.has(child)) return;
                const color = child.material.color;
                if (!color) return;
                const hex = color.getHex();

                // Tree trunks - 0x5c4033
                if (hex === 0x5c4033) {
                    applyTextureToMesh(child, sceneTextures.bark, { roughness: 0.95 });
                }
                // Tree canopy - 0x2d5a27
                else if (hex === 0x2d5a27) {
                    applyTextureToMesh(child, sceneTextures.leaf, { roughness: 0.8 });
                }
                // Ground - 0x3d6b35
                else if (hex === 0x3d6b35) {
                    applyTextureToMesh(child, sceneTextures.grassGround, { roughness: 0.9 });
                }
                // Mountains - 0x4a5568
                else if (hex === 0x4a5568) {

                // Snow caps - 0xffffff
                else if (hex === 0xffffff && child.parent && child.parent.isMesh) {
                    applyTextureToMesh(child, sceneTextures.rock, { roughness: 0.3, metalness: 0.1 });

                // Clouds - white spheres (skip texturing, keep fluffy look)
            });

        }

        // Remove textures and restore original materials
        function removeTexturesFromScene() {
            originalMaterials.forEach((originalMat, mesh) => {
                if (mesh.material !== originalMat) {
                    mesh.material.dispose();
                    mesh.material = originalMat;
                }
            });

        // Track texture mode state
        let textureModeActive = false;
        let sphereTextureEnabled = false;
        let sphereOriginalMaterial = null;

        // ============================================
        // INTERACTIVE MODE - Physics and Interactions
        // ============================================
        let interactiveMode = false;

        const physicsObjects = []; // Objects with physics simulation
        const interactiveRaycaster = new THREE.Raycaster();
        const interactiveMouse = new THREE.Vector2();

        // Physics constants
        const GRAVITY = -15;
        const GROUND_Y = 0;
        const BOUNCE_DAMPING = 0.6;
        const FRICTION = 0.98;
        const FADE_AFTER = 5; // seconds before fading
        const FADE_DURATION = 2; // seconds to fade out
        const MAX_PHYSICS_OBJECTS = 80; // Prevent performance issues

        // Create a physics object from a mesh piece
        function createPhysicsObject(mesh, velocity, angularVelocity) {
            // Mark as debris so it can't be interacted with again
            mesh.userData.isDebris = true;

            // If we have too many physics objects, remove oldest ones
            while (physicsObjects.length >= MAX_PHYSICS_OBJECTS) {
                const oldest = physicsObjects.shift();
                if (oldest.mesh.parent) {
                    oldest.mesh.parent.remove(oldest.mesh);
                }
                if (oldest.mesh.geometry) oldest.mesh.geometry.dispose();
                if (oldest.mesh.material) {
                    if (Array.isArray(oldest.mesh.material)) {
                        oldest.mesh.material.forEach(m => m.dispose());
                    } else {
                        oldest.mesh.material.dispose();
                    }
                }
            }

            return {
                mesh: mesh,
                velocity: velocity || new THREE.Vector3(
                    (Math.random() - 0.5) * 3,
                    Math.random() * 5 + 2,
                    (Math.random() - 0.5) * 3
                ),
                angularVelocity: angularVelocity || new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5
                ),
                age: 0,
                grounded: false,
                bounces: 0
            };
        }

        // Update physics for all objects
        function updatePhysics(deltaTime) {
            for (let i = physicsObjects.length - 1; i >= 0; i--) {
                const obj = physicsObjects[i];
                obj.age += deltaTime;

                // Apply gravity
                if (!obj.grounded) {
                    obj.velocity.y += GRAVITY * deltaTime;
                }

                // Update position
                obj.mesh.position.add(obj.velocity.clone().multiplyScalar(deltaTime));

                // Update rotation
                obj.mesh.rotation.x += obj.angularVelocity.x * deltaTime;
                obj.mesh.rotation.y += obj.angularVelocity.y * deltaTime;
                obj.mesh.rotation.z += obj.angularVelocity.z * deltaTime;

                // Ground collision
                const boundingBox = new THREE.Box3().setFromObject(obj.mesh);
                const bottomY = boundingBox.min.y;

                if (bottomY < GROUND_Y && obj.velocity.y < 0) {
                    // Bounce
                    obj.mesh.position.y += (GROUND_Y - bottomY);
                    obj.velocity.y *= -BOUNCE_DAMPING;
                    obj.velocity.x *= FRICTION;
                    obj.velocity.z *= FRICTION;
                    obj.angularVelocity.multiplyScalar(0.8);
                    obj.bounces++;

                    // Stop bouncing if too slow
                    if (Math.abs(obj.velocity.y) < 0.5) {
                        obj.velocity.y = 0;
                        obj.grounded = true;
                        obj.angularVelocity.set(0, 0, 0);
                    }
                }

                // Fade out after time
                if (obj.age > FADE_AFTER) {
                    const fadeProgress = (obj.age - FADE_AFTER) / FADE_DURATION;
                    if (fadeProgress >= 1) {
                        // Remove object
                        obj.mesh.parent.remove(obj.mesh);
                        if (obj.mesh.geometry) obj.mesh.geometry.dispose();
                        if (obj.mesh.material) {
                            if (Array.isArray(obj.mesh.material)) {
                                obj.mesh.material.forEach(m => m.dispose());
                            } else {
                                obj.mesh.material.dispose();
                            }
                        }
                        physicsObjects.splice(i, 1);
                    } else {
                        // Fade opacity
                        if (obj.mesh.material && !obj.mesh.material.transparent) {
                            obj.mesh.material.transparent = true;
                        }
                        if (obj.mesh.material) {
                            obj.mesh.material.opacity = 1 - fadeProgress;
                        }
                    }
                }
            }
        }

        // Chop bamboo lathe geometry at intersection point
        function chopBambooLathe(bambooMesh, intersectPoint) {
            playSound('bambooChop');
            const bambooGroup = bambooMesh.parent;
            const parent = bambooGroup.parent;

            // Get world position of the bamboo group
            const groupWorldPos = new THREE.Vector3();
            bambooGroup.getWorldPosition(groupWorldPos);

            // Get bounding box to determine height
            const bbox = new THREE.Box3().setFromObject(bambooMesh);
            const totalHeight = bbox.max.y - bbox.min.y;
            const baseY = groupWorldPos.y;

            // Calculate chop height
            const chopY = intersectPoint.y;
            const chopHeight = chopY - baseY;
            const chopRatio = chopHeight / totalHeight;

            if (chopRatio < 0.15 || chopRatio > 0.85) return; // Don't chop at extremes

            const radius = 0.07;

            // Create bottom piece (stays in place) - simple cylinder
            const bottomGeo = new THREE.CylinderGeometry(radius, radius * 1.1, chopHeight, 8);
            const bottomMat = bambooMesh.material.clone();
            const bottomPiece = new THREE.Mesh(bottomGeo, bottomMat);
            bottomPiece.position.set(groupWorldPos.x, baseY + chopHeight / 2, groupWorldPos.z);
            parent.add(bottomPiece);

            // Create top piece (falls with physics)
            const topHeight = totalHeight - chopHeight;
            const topGeo = new THREE.CylinderGeometry(radius * 0.9, radius, topHeight, 8);
            const topMat = bambooMesh.material.clone();
            const topPiece = new THREE.Mesh(topGeo, topMat);
            topPiece.position.set(groupWorldPos.x, chopY + topHeight / 2, groupWorldPos.z);
            parent.add(topPiece);

            // Add leaves to top piece if original had them
            bambooGroup.traverse(child => {
                if (child !== bambooMesh && child.isMesh && child.material.color.getHex() === 0x5a9c2e) {
                    // Clone leaf
                    const leafClone = child.clone();
                    const leafWorldPos = new THREE.Vector3();
                    child.getWorldPosition(leafWorldPos);
                    // Only include leaves above chop point
                    if (leafWorldPos.y > chopY) {
                        leafClone.position.copy(leafWorldPos);
                        leafClone.position.y -= chopY;
                        topPiece.add(leafClone);
                    }
                }
            });

            // Add physics to top piece - falls and tumbles
            const fallDirection = new THREE.Vector3(
                (Math.random() - 0.5) * 2,
                0.5,
                (Math.random() - 0.5) * 2
            ).normalize();

            physicsObjects.push(createPhysicsObject(topPiece,
                fallDirection.multiplyScalar(2),
                new THREE.Vector3((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 4)
            ));

            // Remove original bamboo group
            parent.remove(bambooGroup);
            bambooGroup.traverse(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.dispose());
                    } else {
                        child.material.dispose();
                    }
                }
            });
        }

        // Explode and reconstitute - for drift world floating stones
        const reconstitutingObjects = []; // Track objects that are reconstituting

        function explodeAndReconstitute(stoneMesh, intersectPoint) {
            if (stoneMesh.userData.isExploding) return; // Already exploding
            playSound('driftExplode');

            const parent = stoneMesh.parent || scene;
            const originalPos = stoneMesh.position.clone();
            const originalRot = stoneMesh.rotation.clone();
            const originalScale = stoneMesh.scale.clone();
            const originalUserData = { ...stoneMesh.userData };

            // Hide original and its hitbox temporarily
            stoneMesh.visible = false;
            stoneMesh.userData.isExploding = true;
            stoneMesh.userData.noInteract = true;  // Skip in raycasting
            const linkedHitbox = stoneMesh.userData.linkedHitbox;
            if (linkedHitbox) {
                linkedHitbox.visible = false;
                linkedHitbox.userData.noInteract = true;  // Skip in raycasting
            }

            // Get geometry faces/triangles
            const geo = stoneMesh.geometry;
            const posAttr = geo.attributes.position;
            const pieces = [];

            // Create triangular pieces from the geometry
            const pieceCount = Math.min(12, Math.floor(posAttr.count / 3));
            for (let i = 0; i < pieceCount; i++) {
                // Create a small triangular piece
                const pieceGeo = new THREE.TetrahedronGeometry(0.06 + Math.random() * 0.04, 0);
                const pieceMat = stoneMesh.material.clone();
                const piece = new THREE.Mesh(pieceGeo, pieceMat);
                piece.castShadow = true;  // Shards cast shadows too
                piece.userData.noInteract = true;  // Click through to clusters behind

                // Start at stone center with random offset
                const offset = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2
                );
                piece.position.copy(originalPos).add(offset);
                piece.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );

                parent.add(piece);

                // Calculate explosion direction (outward from center)
                const explodeDir = offset.clone().normalize();
                if (explodeDir.length() < 0.1) {
                    explodeDir.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
                }

                pieces.push({
                    mesh: piece,
                    startPos: piece.position.clone(),
                    targetPos: piece.position.clone().add(explodeDir.multiplyScalar(1.5 + Math.random())),
                    originalOffset: offset,
                    explodeDir: explodeDir,
                    rotSpeed: new THREE.Vector3(
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 15
                    ),
                    phase: 0 // 0 = exploding, 1 = hovering, 2 = reconstituting
                });
            }

            // Add to reconstituting tracker
            reconstitutingObjects.push({
                original: stoneMesh,
                pieces: pieces,
                parent: parent,
                originalPos: originalPos,
                originalRot: originalRot,
                originalScale: originalScale,
                originalUserData: originalUserData,
                time: 0,
                explodeDuration: 0.3,
                hoverDuration: 0.4,
                reconstituteDuration: 0.5
            });
        }

        // Update reconstituting objects (called in animate loop)
        function updateReconstituting(deltaTime) {
            for (let i = reconstitutingObjects.length - 1; i >= 0; i--) {
                const obj = reconstitutingObjects[i];
                obj.time += deltaTime;

                const totalDuration = obj.explodeDuration + obj.hoverDuration + obj.reconstituteDuration;

                for (const piece of obj.pieces) {
                    if (obj.time < obj.explodeDuration) {
                        // Phase 0: Exploding outward
                        const t = obj.time / obj.explodeDuration;
                        const easeOut = 1 - Math.pow(1 - t, 3);
                        piece.mesh.position.lerpVectors(piece.startPos, piece.targetPos, easeOut);
                    } else if (obj.time < obj.explodeDuration + obj.hoverDuration) {
                        // Phase 1: Hovering/floating
                        const hoverT = (obj.time - obj.explodeDuration) / obj.hoverDuration;
                        const wobble = Math.sin(hoverT * Math.PI * 4) * 0.05;
                        piece.mesh.position.copy(piece.targetPos);
                        piece.mesh.position.y += wobble;
                    } else {
                        // Phase 2: Reconstituting
                        const t = (obj.time - obj.explodeDuration - obj.hoverDuration) / obj.reconstituteDuration;
                        const easeIn = t * t * t;
                        const targetReturn = obj.originalPos.clone().add(piece.originalOffset.clone().multiplyScalar(0.1));
                        piece.mesh.position.lerpVectors(piece.targetPos, targetReturn, easeIn);

                        // Scale down as they merge
                        const scale = 1 - easeIn * 0.5;
                        piece.mesh.scale.setScalar(scale);
                    }

                    // Always rotate
                    piece.mesh.rotation.x += piece.rotSpeed.x * deltaTime;
                    piece.mesh.rotation.y += piece.rotSpeed.y * deltaTime;
                    piece.mesh.rotation.z += piece.rotSpeed.z * deltaTime;
                }

                // Complete reconstitution
                if (obj.time >= totalDuration) {
                    // Remove pieces
                    for (const piece of obj.pieces) {
                        obj.parent.remove(piece.mesh);
                        piece.mesh.geometry.dispose();
                        piece.mesh.material.dispose();
                    }

                    // Restore original
                    obj.original.visible = true;
                    obj.original.userData = obj.originalUserData;
                    obj.original.userData.isExploding = false;
                    obj.original.userData.noInteract = false;  // Restore interactivity
                    playSound('driftReconstitute');

                    // Restore hitbox visibility and interactivity
                    if (obj.original.userData.linkedHitbox) {
                        obj.original.userData.linkedHitbox.visible = true;
                        obj.original.userData.linkedHitbox.userData.noInteract = false;
                    }

                    // Remove from tracking
                    reconstitutingObjects.splice(i, 1);
                }
            }
        }

        // Kick object (for toys, spinners, etc.)

            playSound('toyKick');
            // Calculate kick direction (away from camera)
